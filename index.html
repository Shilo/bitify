<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bitify</title>
    <meta name="description" content="Instantly convert sprites and animated GIFs to 1-bit colors and styles. It runs in your browser and nothing is uploaded." />
    <!-- The preview a chat or social app shows for a link. Those apps want whole addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitify" />
    <meta property="og:title" content="Bitify" />
    <meta property="og:description" content="Instantly convert sprites and animated GIFs to 1-bit colors and styles. It runs in your browser and nothing is uploaded." />
    <meta property="og:url" content="https://shilo.github.io/bitify/" />
    <meta property="og:image" content="https://shilo.github.io/bitify/maskable-icon-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Bitify logo" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#f1f2f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191c20" media="(prefers-color-scheme: dark)" />
    <!-- Resolve the saved or system theme before any CSS paints (see App.svelte). -->
    <script>
      let initialTheme;
      try {
        initialTheme = JSON.parse(localStorage.getItem('bitify'))?.theme;
      } catch {
        // Unavailable or invalid storage still follows the system.
      }
      const resolvedTheme = initialTheme === 'light' || initialTheme === 'dark'
        ? initialTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = resolvedTheme;
      for (const meta of document.querySelectorAll('meta[name=theme-color]')) {
        meta.content = resolvedTheme === 'dark' ? '#191c20' : '#f1f2f3';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Schibsted+Grotesk:wght@400..700&display=swap" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
