<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870">
<rect width="1200" height="870" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020">Colorfetti · Square frame, varied confetti</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">One matching piece at each right corner. Three or four varied pieces inside. Every silhouette is square.</text>
<rect x="24" y="104" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="42" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">01 · Full fragments</text>
<svg x="75" y="150" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="10" height="7" fill="#ef6256"/><rect x="24" y="12" width="10" height="5" fill="#f0b644"/><rect x="12" y="21" width="6" height="5" fill="#419ca7"/><rect x="20" y="19" width="14" height="7" fill="#7267b5"/></svg>
<text x="42" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Four varied pieces fill the open center.</text>
<text x="42" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Larger blocks give the color plenty of presence.</text>
<rect x="416" y="104" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="434" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">02 · Offset pieces</text>
<svg x="467" y="150" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="8" height="8" fill="#ef6256"/><rect x="23" y="12" width="11" height="4" fill="#f0b644"/><rect x="22" y="18" width="8" height="8" fill="#7267b5"/><rect x="12" y="22" width="8" height="4" fill="#419ca7"/></svg>
<text x="434" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Four pieces with staggered edges and sizes.</text>
<text x="434" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A less orderly arrangement inside the same C.</text>
<rect x="808" y="104" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="826" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">03 · Three bold pieces</text>
<svg x="859" y="150" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="10" height="8" fill="#ef6256"/><rect x="24" y="12" width="10" height="14" fill="#f0b644"/><rect x="12" y="22" width="10" height="4" fill="#419ca7"/></svg>
<text x="826" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Three center fragments, including a tall one.</text>
<text x="826" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A compact mix of square and rectangular forms.</text>
<rect x="24" y="476" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="42" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">04 · Wide and short</text>
<svg x="75" y="522" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="22" height="6" fill="#ef6256"/><rect x="12" y="20" width="8" height="6" fill="#419ca7"/><rect x="22" y="20" width="12" height="6" fill="#7267b5"/></svg>
<text x="42" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Three broad pieces make a fuller picture.</text>
<text x="42" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Different widths keep the center asymmetrical.</text>
<rect x="416" y="476" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="434" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">05 · Loose confetti</text>
<svg x="467" y="522" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="12" height="6" fill="#ef6256"/><rect x="27" y="12" width="7" height="3" fill="#f0b644"/><rect x="12" y="21" width="7" height="5" fill="#419ca7"/><rect x="22" y="20" width="12" height="6" fill="#7267b5"/></svg>
<text x="434" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Four fragments, including a smaller floating piece.</text>
<text x="434" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">More varied gaps give the center a playful feel.</text>
<rect x="808" y="476" width="368" height="352" rx="12" fill="#fffdf9"/>
<text x="826" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">06 · Tall and wide</text>
<svg x="859" y="522" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#f0b644"/><rect x="28" y="28" width="6" height="6" fill="#7267b5"/><rect x="12" y="12" width="7" height="14" fill="#ef6256"/><rect x="21" y="12" width="13" height="5" fill="#f0b644"/><rect x="21" y="19" width="5" height="7" fill="#419ca7"/><rect x="28" y="19" width="6" height="7" fill="#7267b5"/></svg>
<text x="826" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Four pieces contrast a tall strip with wider blocks.</text>
<text x="826" y="810" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The square outline and corner tiles stay fixed.</text>
</svg>