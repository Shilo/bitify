<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866">
<rect width="1200" height="866" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020">Colorfetti · C + flat color flag</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">Four flat color pieces. Thick black C. Right-side pieces aligned to the outer top and bottom.</text>
<rect x="24" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="42" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">01 · Half-width C</text>
<svg x="88" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="16" height="4" fill="#202020"/><rect x="4" y="8" width="4" height="24" fill="#202020"/><rect x="4" y="32" width="16" height="4" fill="#202020"/><rect x="10" y="10" width="10" height="9" fill="#ef6256"/><rect x="22" y="4" width="14" height="15" fill="#f0b644"/><rect x="10" y="21" width="10" height="9" fill="#419ca7"/><rect x="22" y="21" width="14" height="15" fill="#7267b5"/></svg>
<text x="42" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 50% / 50% of the total width.</text>
<text x="42" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Right tiles align with the C at top and bottom.</text>
<rect x="416" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="434" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">02 · Half top, longer base</text>
<svg x="480" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="16" height="4" fill="#202020"/><rect x="4" y="8" width="4" height="24" fill="#202020"/><rect x="4" y="32" width="24" height="4" fill="#202020"/><rect x="10" y="10" width="10" height="9" fill="#ef6256"/><rect x="22" y="4" width="14" height="15" fill="#f0b644"/><rect x="10" y="21" width="18" height="9" fill="#419ca7"/><rect x="30" y="21" width="6" height="15" fill="#7267b5"/></svg>
<text x="434" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 50% top / 75% bottom.</text>
<text x="434" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The lower-left tile fills above the longer base.</text>
<rect x="808" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="826" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">03 · Three-quarter C</text>
<svg x="872" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="4" fill="#202020"/><rect x="4" y="8" width="4" height="24" fill="#202020"/><rect x="4" y="32" width="24" height="4" fill="#202020"/><rect x="10" y="10" width="18" height="9" fill="#ff6658"/><rect x="30" y="4" width="6" height="15" fill="#ffc14a"/><rect x="10" y="21" width="18" height="9" fill="#2eafa6"/><rect x="30" y="21" width="6" height="15" fill="#8664d8"/></svg>
<text x="826" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 75% / 75%, with a larger inner picture.</text>
<text x="826" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Slim right-side tiles complete the flat composition.</text>
<rect x="24" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="42" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">04 · Long top, half base</text>
<svg x="88" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="4" fill="#202020"/><rect x="4" y="8" width="4" height="24" fill="#202020"/><rect x="4" y="32" width="16" height="4" fill="#202020"/><rect x="10" y="10" width="18" height="9" fill="#ef6256"/><rect x="30" y="4" width="6" height="15" fill="#f0b644"/><rect x="10" y="21" width="10" height="9" fill="#419ca7"/><rect x="22" y="21" width="14" height="15" fill="#7267b5"/></svg>
<text x="42" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 75% top / 50% bottom.</text>
<text x="42" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The asymmetry shifts the weight to the top.</text>
<rect x="416" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="434" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">05 · Airier four-piece flag</text>
<svg x="480" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="16" height="4" fill="#202020"/><rect x="4" y="8" width="4" height="24" fill="#202020"/><rect x="4" y="32" width="16" height="4" fill="#202020"/><rect x="10" y="10" width="10" height="8" fill="#e86e94"/><rect x="22" y="4" width="14" height="14" fill="#8c77d2"/><rect x="10" y="22" width="10" height="8" fill="#439fac"/><rect x="22" y="22" width="14" height="14" fill="#5b83c5"/></svg>
<text x="434" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 50% / 50%, with wider tile gutters.</text>
<text x="434" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Square outer tiles keep the silhouette balanced.</text>
<rect x="808" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="826" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">06 · Bolder asymmetric C</text>
<svg x="872" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="16" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="24" height="6" fill="#202020"/><rect x="12" y="12" width="8" height="7" fill="#ff6658"/><rect x="22" y="4" width="14" height="15" fill="#ffc14a"/><rect x="12" y="21" width="16" height="7" fill="#2eafa6"/><rect x="30" y="21" width="6" height="15" fill="#8664d8"/></svg>
<text x="826" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">C arms: 50% top / 75% bottom, with more weight.</text>
<text x="826" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A thicker spine emphasizes the letterform.</text>
<text x="32" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Arm percentages use the full icon width, including the colored pieces on the right.</text>
</svg>