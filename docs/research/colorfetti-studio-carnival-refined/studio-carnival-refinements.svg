<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="904" viewBox="0 0 1080 904">
<rect width="1080" height="904" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#202020">Colorfetti · Carnival and Studio refinements</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">Same square shape and exact spacing. Two palette refinements for each direction.</text>
<rect x="24" y="104" width="504" height="380" rx="12" fill="#fffdf9"/>
<text x="44" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#202020">01 · Carnival · Direct swap</text>
<svg x="143" y="158" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#FF8A32"/><rect x="28" y="28" width="6" height="6" fill="#7755C7"/><rect x="12" y="12" width="14" height="6" fill="#E94785"/><rect x="12" y="20" width="14" height="6" fill="#F2C84B"/><rect x="28" y="12" width="6" height="14" fill="#1BB6AE"/></svg>
<text x="44" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Original hues, with teal on the bar and yellow inside.</text>
<text x="44" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5c6670">#FF8A32  #7755C7  #E94785  #F2C84B  #1BB6AE</text>
<rect x="552" y="104" width="504" height="380" rx="12" fill="#fffdf9"/>
<text x="572" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#202020">02 · Carnival · Refined</text>
<svg x="671" y="158" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#F47A34"/><rect x="28" y="28" width="6" height="6" fill="#7952C7"/><rect x="12" y="12" width="14" height="6" fill="#E63E82"/><rect x="12" y="20" width="14" height="6" fill="#F4C340"/><rect x="28" y="12" width="6" height="14" fill="#0EAAA5"/></svg>
<text x="572" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Clearer orange, vivid pink, rich violet, and deeper teal.</text>
<text x="572" y="469" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5c6670">#F47A34  #7952C7  #E63E82  #F4C340  #0EAAA5</text>
<rect x="24" y="494" width="504" height="380" rx="12" fill="#fffdf9"/>
<text x="44" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#202020">03 · Studio · Coral and jade</text>
<svg x="143" y="548" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#F0B83F"/><rect x="28" y="28" width="6" height="6" fill="#865BC4"/><rect x="12" y="12" width="14" height="6" fill="#F26664"/><rect x="12" y="20" width="14" height="6" fill="#20A58B"/><rect x="28" y="12" width="6" height="14" fill="#4779CB"/></svg>
<text x="44" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Warmer coral and jade soften the primary-color feel.</text>
<text x="44" y="859" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5c6670">#F0B83F  #865BC4  #F26664  #20A58B  #4779CB</text>
<rect x="552" y="494" width="504" height="380" rx="12" fill="#fffdf9"/>
<text x="572" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#202020">04 · Studio · Berry and blue</text>
<svg x="671" y="548" width="266" height="266" viewBox="0 0 38 38" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="18" fill="#202020"/><rect x="4" y="28" width="22" height="6" fill="#202020"/><rect x="28" y="4" width="6" height="6" fill="#F6A443"/><rect x="28" y="28" width="6" height="6" fill="#845CCC"/><rect x="12" y="12" width="14" height="6" fill="#DA4C7F"/><rect x="12" y="20" width="14" height="6" fill="#30AA80"/><rect x="28" y="12" width="6" height="14" fill="#3F80C9"/></svg>
<text x="572" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Berry pink and apricot give Studio a more festive identity.</text>
<text x="572" y="859" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5c6670">#F6A443  #845CCC  #DA4C7F  #30AA80  #3F80C9</text>
</svg>