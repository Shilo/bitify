<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<rect width="1200" height="860" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020">Colorfetti · Thick spine, longer equal arms</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">Six flat designs. The same thick black spine. Equal top and bottom arms, all wider than 50%.</text>
<rect x="24" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="42" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">01 · Compact wide C</text>
<svg x="88" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="20" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="20" height="6" fill="#202020"/><rect x="12" y="12" width="12" height="7" fill="#ef6256"/><rect x="26" y="4" width="10" height="15" fill="#f0b644"/><rect x="12" y="21" width="12" height="7" fill="#419ca7"/><rect x="26" y="21" width="10" height="15" fill="#7267b5"/></svg>
<text x="42" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 62.5% of the icon width.</text>
<text x="42" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Larger outer blocks balance the thick spine.</text>
<rect x="416" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="434" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">02 · Balanced wide C</text>
<svg x="480" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="22" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="22" height="6" fill="#202020"/><rect x="12" y="12" width="14" height="7" fill="#ef6256"/><rect x="28" y="4" width="8" height="15" fill="#f0b644"/><rect x="12" y="21" width="14" height="7" fill="#419ca7"/><rect x="28" y="21" width="8" height="15" fill="#7267b5"/></svg>
<text x="434" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 68.75% of the icon width.</text>
<text x="434" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A little more frame, a little less outer color.</text>
<rect x="808" y="104" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="826" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">03 · Three-quarter C</text>
<svg x="872" y="154" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="24" height="6" fill="#202020"/><rect x="12" y="12" width="16" height="7" fill="#ef6256"/><rect x="30" y="4" width="6" height="15" fill="#f0b644"/><rect x="12" y="21" width="16" height="7" fill="#419ca7"/><rect x="30" y="21" width="6" height="15" fill="#7267b5"/></svg>
<text x="826" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 75% of the icon width.</text>
<text x="826" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A strong C around a broad inner mosaic.</text>
<rect x="24" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="42" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">04 · Long-arm C</text>
<svg x="88" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="26" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="26" height="6" fill="#202020"/><rect x="12" y="12" width="18" height="7" fill="#ef6256"/><rect x="32" y="4" width="4" height="15" fill="#f0b644"/><rect x="12" y="21" width="18" height="7" fill="#419ca7"/><rect x="32" y="21" width="4" height="15" fill="#7267b5"/></svg>
<text x="42" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 81.25% of the icon width.</text>
<text x="42" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Slim outer pieces emphasize the frame.</text>
<rect x="416" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="434" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">05 · Airier three-quarter C</text>
<svg x="480" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="24" height="6" fill="#202020"/><rect x="12" y="12" width="16" height="6" fill="#ef6256"/><rect x="30" y="4" width="6" height="14" fill="#f0b644"/><rect x="12" y="22" width="16" height="6" fill="#419ca7"/><rect x="30" y="22" width="6" height="14" fill="#7267b5"/></svg>
<text x="434" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 75%, with a wider horizontal gap.</text>
<text x="434" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">More breathing room between the two rows.</text>
<rect x="808" y="472" width="368" height="348" rx="12" fill="#fffdf9"/>
<text x="826" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">06 · Packed three-quarter C</text>
<svg x="872" y="522" width="240" height="240" viewBox="0 0 40 40" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="6" fill="#202020"/><rect x="4" y="10" width="6" height="20" fill="#202020"/><rect x="4" y="30" width="24" height="6" fill="#202020"/><rect x="11" y="11" width="17" height="8" fill="#ef6256"/><rect x="29" y="4" width="7" height="15" fill="#f0b644"/><rect x="11" y="21" width="17" height="8" fill="#419ca7"/><rect x="29" y="21" width="7" height="15" fill="#7267b5"/></svg>
<text x="826" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Equal arms: 75%, with tighter tile gutters.</text>
<text x="826" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Larger inner pieces give color more weight.</text>
</svg>