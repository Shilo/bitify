<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1152" viewBox="0 0 1140 1152">
<rect width="1140" height="1152" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020">Colorfetti · Black C canvas variations</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">Thick black frame throughout. Variations in the pixels, right edge, and C opening.</text>
<rect x="24" y="104" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="42" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">01 · Bigger, wider pieces</text>
<svg x="90" y="152" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="7" y="7" width="5" height="5" fill="#ef6256"/><rect x="14" y="7" width="7" height="3" fill="#f0b644"/><rect x="7" y="13" width="4" height="4" fill="#419ca7"/><rect x="13" y="11" width="8" height="6" fill="#7267b5"/></svg>
<text x="42" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Larger fragments reach the full width</text>
<text x="42" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">of the open canvas.</text>
<rect x="396" y="104" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="414" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">02 · Full-width mosaic</text>
<svg x="462" y="152" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="7" y="7" width="6" height="5" fill="#ef6256"/><rect x="14" y="7" width="7" height="5" fill="#f0b644"/><rect x="7" y="13" width="6" height="4" fill="#419ca7"/><rect x="14" y="13" width="7" height="4" fill="#7267b5"/></svg>
<text x="414" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">An almost solid picture of color,</text>
<text x="414" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">with one clean cross-shaped gap.</text>
<rect x="768" y="104" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="786" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">03 · Right-edge confetti</text>
<svg x="834" y="152" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="7" y="7" width="4" height="4" fill="#ef6256"/><rect x="13" y="7" width="3" height="3" fill="#f0b644"/><rect x="7" y="13" width="3" height="3" fill="#419ca7"/><rect x="11" y="11" width="5" height="5" fill="#7267b5"/><rect x="18" y="10" width="3" height="3" fill="#ef6256"/></svg>
<text x="786" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">The original inner arrangement, plus</text>
<text x="786" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">a pixel aligned with the right edge.</text>
<rect x="24" y="448" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="42" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">04 · Two edge pieces</text>
<svg x="90" y="496" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="7" y="7" width="4" height="4" fill="#ef6256"/><rect x="13" y="7" width="3" height="3" fill="#f0b644"/><rect x="7" y="13" width="3" height="3" fill="#419ca7"/><rect x="11" y="11" width="5" height="5" fill="#7267b5"/><rect x="18" y="7" width="3" height="3" fill="#ef6256"/><rect x="18" y="14" width="3" height="3" fill="#f0b644"/></svg>
<text x="42" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Two detached fragments trace the</text>
<text x="42" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">missing side without closing the C.</text>
<rect x="396" y="448" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="414" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">05 · Slightly more closed</text>
<svg x="462" y="496" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="18" y="6" width="3" height="2" fill="#202020"/><rect x="18" y="16" width="3" height="2" fill="#202020"/><rect x="7" y="7" width="5" height="5" fill="#ef6256"/><rect x="13" y="7" width="4" height="3" fill="#f0b644"/><rect x="7" y="13" width="4" height="4" fill="#419ca7"/><rect x="12" y="11" width="5" height="6" fill="#7267b5"/></svg>
<text x="414" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Short black returns strengthen the</text>
<text x="414" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">picture-frame shape.</text>
<rect x="768" y="448" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="786" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">06 · Narrower C opening</text>
<svg x="834" y="496" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="18" y="6" width="3" height="4" fill="#202020"/><rect x="18" y="14" width="3" height="4" fill="#202020"/><rect x="7" y="7" width="5" height="5" fill="#ef6256"/><rect x="13" y="7" width="4" height="4" fill="#f0b644"/><rect x="7" y="13" width="4" height="4" fill="#419ca7"/><rect x="12" y="12" width="5" height="5" fill="#7267b5"/></svg>
<text x="786" y="732" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Longer returns leave a clear opening</text>
<text x="786" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">beside a generous inner mosaic.</text>
<rect x="24" y="792" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="42" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">07 · Closed C + side pixel</text>
<svg x="90" y="840" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="18" y="6" width="3" height="2" fill="#202020"/><rect x="18" y="16" width="3" height="2" fill="#202020"/><rect x="7" y="7" width="4" height="4" fill="#ef6256"/><rect x="13" y="7" width="3" height="3" fill="#f0b644"/><rect x="7" y="13" width="3" height="3" fill="#419ca7"/><rect x="11" y="11" width="5" height="5" fill="#7267b5"/><rect x="19" y="10" width="2" height="3" fill="#ef6256"/></svg>
<text x="42" y="1076" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">A more enclosed C with one floating</text>
<text x="42" y="1096" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">coral piece in its opening.</text>
<rect x="396" y="792" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="414" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">08 · Confetti canvas remix</text>
<svg x="462" y="840" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="18" y="6" width="3" height="1" fill="#202020"/><rect x="18" y="17" width="3" height="1" fill="#202020"/><rect x="7" y="7" width="4" height="4" fill="#ef6256"/><rect x="12" y="7" width="3" height="3" fill="#f0b644"/><rect x="7" y="12" width="3" height="3" fill="#419ca7"/><rect x="11" y="11" width="4" height="4" fill="#7267b5"/><rect x="18" y="9" width="3" height="3" fill="#ef6256"/></svg>
<text x="414" y="1076" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">Reference-style blocks and one side</text>
<text x="414" y="1096" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">fragment, held by a black C frame.</text>
<rect x="768" y="792" width="348" height="326" rx="12" fill="#fffdf9"/>
<text x="786" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202020">09 · A pixel breaks free</text>
<svg x="834" y="840" width="216" height="216" viewBox="0 0 24 24" shape-rendering="crispEdges"><rect x="3" y="3" width="18" height="3" fill="#202020"/><rect x="3" y="6" width="3" height="12" fill="#202020"/><rect x="3" y="18" width="18" height="3" fill="#202020"/><rect x="7" y="7" width="5" height="5" fill="#ef6256"/><rect x="14" y="7" width="6" height="3" fill="#f0b644"/><rect x="7" y="13" width="4" height="4" fill="#419ca7"/><rect x="13" y="11" width="6" height="6" fill="#7267b5"/><rect x="22" y="10" width="2" height="2" fill="#ef6256"/></svg>
<text x="786" y="1076" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">The C stays open while a confetti</text>
<text x="786" y="1096" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6670">piece floats just beyond the frame.</text>
</svg>