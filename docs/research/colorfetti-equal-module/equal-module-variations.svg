<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
<rect width="1200" height="880" fill="#f7f5ef"/>
<text x="32" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020">Colorfetti · One thickness, one grid</text>
<text x="32" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5c6670">Every confetti piece is a matching square. The C stroke has the same thickness. The center is filled.</text>
<rect x="24" y="104" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="42" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">01 · Balanced grid</text>
<svg x="64" y="142" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="9" y="9" width="22" height="6" fill="#202020"/><rect x="9" y="15" width="6" height="18" fill="#202020"/><rect x="9" y="33" width="22" height="6" fill="#202020"/><rect x="33" y="9" width="6" height="6" fill="#f0b644"/><rect x="17" y="17" width="6" height="6" fill="#ef6256"/><rect x="25" y="17" width="6" height="6" fill="#f0b644"/><rect x="33" y="17" width="6" height="6" fill="#f0b644"/><rect x="17" y="25" width="6" height="6" fill="#419ca7"/><rect x="25" y="25" width="6" height="6" fill="#419ca7"/><rect x="33" y="25" width="6" height="6" fill="#7267b5"/><rect x="33" y="33" width="6" height="6" fill="#7267b5"/></svg>
<text x="42" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">One thickness for the frame and every square.</text>
<text x="42" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Two filled center rows, with even pixel gutters.</text>
<rect x="416" y="104" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="434" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">02 · Tight grid</text>
<svg x="456" y="142" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="10" y="10" width="20" height="6" fill="#202020"/><rect x="10" y="16" width="6" height="15" fill="#202020"/><rect x="10" y="31" width="20" height="6" fill="#202020"/><rect x="31" y="10" width="6" height="6" fill="#f0b644"/><rect x="17" y="17" width="6" height="6" fill="#ef6256"/><rect x="24" y="17" width="6" height="6" fill="#f0b644"/><rect x="31" y="17" width="6" height="6" fill="#f0b644"/><rect x="17" y="24" width="6" height="6" fill="#419ca7"/><rect x="24" y="24" width="6" height="6" fill="#419ca7"/><rect x="31" y="24" width="6" height="6" fill="#7267b5"/><rect x="31" y="31" width="6" height="6" fill="#7267b5"/></svg>
<text x="434" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The same module, with smaller gaps.</text>
<text x="434" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">More color coverage inside the black C.</text>
<rect x="808" y="104" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="826" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">03 · Airier grid</text>
<svg x="848" y="142" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="7" y="7" width="24" height="6" fill="#202020"/><rect x="7" y="13" width="6" height="21" fill="#202020"/><rect x="7" y="34" width="24" height="6" fill="#202020"/><rect x="34" y="7" width="6" height="6" fill="#f0b644"/><rect x="16" y="16" width="6" height="6" fill="#ef6256"/><rect x="25" y="16" width="6" height="6" fill="#f0b644"/><rect x="34" y="16" width="6" height="6" fill="#f0b644"/><rect x="16" y="25" width="6" height="6" fill="#419ca7"/><rect x="25" y="25" width="6" height="6" fill="#419ca7"/><rect x="34" y="25" width="6" height="6" fill="#7267b5"/><rect x="34" y="34" width="6" height="6" fill="#7267b5"/></svg>
<text x="826" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Matching squares, with wider spacing.</text>
<text x="826" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Each individual confetti piece stays visible.</text>
<rect x="24" y="484" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="42" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">04 · Wide canvas</text>
<svg x="64" y="522" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="5" y="9" width="30" height="6" fill="#202020"/><rect x="5" y="15" width="6" height="18" fill="#202020"/><rect x="5" y="33" width="30" height="6" fill="#202020"/><rect x="37" y="9" width="6" height="6" fill="#f0b644"/><rect x="13" y="17" width="6" height="6" fill="#ef6256"/><rect x="21" y="17" width="6" height="6" fill="#f0b644"/><rect x="29" y="17" width="6" height="6" fill="#f0b644"/><rect x="37" y="17" width="6" height="6" fill="#f0b644"/><rect x="13" y="25" width="6" height="6" fill="#419ca7"/><rect x="21" y="25" width="6" height="6" fill="#419ca7"/><rect x="29" y="25" width="6" height="6" fill="#419ca7"/><rect x="37" y="25" width="6" height="6" fill="#7267b5"/><rect x="37" y="33" width="6" height="6" fill="#7267b5"/></svg>
<text x="42" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Longer equal arms and an extra center column.</text>
<text x="42" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">Every tile still matches the frame thickness.</text>
<rect x="416" y="484" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="434" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">05 · Tall canvas</text>
<svg x="456" y="522" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="9" y="5" width="22" height="6" fill="#202020"/><rect x="9" y="11" width="6" height="26" fill="#202020"/><rect x="9" y="37" width="22" height="6" fill="#202020"/><rect x="33" y="5" width="6" height="6" fill="#f0b644"/><rect x="17" y="13" width="6" height="6" fill="#ef6256"/><rect x="25" y="13" width="6" height="6" fill="#f0b644"/><rect x="33" y="13" width="6" height="6" fill="#f0b644"/><rect x="17" y="21" width="6" height="6" fill="#419ca7"/><rect x="25" y="21" width="6" height="6" fill="#ef6256"/><rect x="33" y="21" width="6" height="6" fill="#7267b5"/><rect x="17" y="29" width="6" height="6" fill="#419ca7"/><rect x="25" y="29" width="6" height="6" fill="#419ca7"/><rect x="33" y="29" width="6" height="6" fill="#7267b5"/><rect x="33" y="37" width="6" height="6" fill="#7267b5"/></svg>
<text x="434" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">An extra middle row gives a taller C.</text>
<text x="434" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The top and bottom edge tiles match its arms.</text>
<rect x="808" y="484" width="368" height="360" rx="12" fill="#fffdf9"/>
<text x="826" y="516" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#202020">06 · Compact canvas</text>
<svg x="848" y="522" width="288" height="288" viewBox="0 0 48 48" shape-rendering="crispEdges"><rect x="13" y="9" width="14" height="6" fill="#202020"/><rect x="13" y="15" width="6" height="18" fill="#202020"/><rect x="13" y="33" width="14" height="6" fill="#202020"/><rect x="29" y="9" width="6" height="6" fill="#f0b644"/><rect x="21" y="17" width="6" height="6" fill="#ef6256"/><rect x="29" y="17" width="6" height="6" fill="#f0b644"/><rect x="21" y="25" width="6" height="6" fill="#419ca7"/><rect x="29" y="25" width="6" height="6" fill="#7267b5"/><rect x="29" y="33" width="6" height="6" fill="#7267b5"/></svg>
<text x="826" y="804" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">A narrower C with fewer, larger-looking pieces.</text>
<text x="826" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c6670">The same square module fills the center.</text>
</svg>