<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800">
<rect width="1080" height="800" fill="#f7f5ef"/>
<text x="32" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#273342" font-weight="600">Colorfetti · C canvas</text>
<text x="32" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5c6670" font-weight="400">An open C-shaped picture frame, with colorful pixels inside.</text>
<rect x="24" y="110" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="44" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">01 · Square canvas</text>
<svg x="92" y="164" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="2" fill="#273342"/><rect x="2" y="4" width="2" height="8" fill="#273342"/><rect x="2" y="12" width="12" height="2" fill="#273342"/><rect x="5" y="5" width="3" height="3" fill="#ef6256"/><rect x="9" y="5" width="2" height="2" fill="#f0b644"/><rect x="5" y="9" width="2" height="2" fill="#419ca7"/><rect x="8" y="8" width="3" height="3" fill="#7267b5"/></svg>
<text x="44" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">Closest to the reference;</text>
<text x="44" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">a fully open right edge.</text>
<rect x="376" y="110" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="396" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">02 · Bracket canvas</text>
<svg x="444" y="164" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="2" fill="#477ac7"/><rect x="2" y="4" width="2" height="8" fill="#477ac7"/><rect x="2" y="12" width="12" height="2" fill="#477ac7"/><rect x="12" y="4" width="2" height="2" fill="#477ac7"/><rect x="12" y="10" width="2" height="2" fill="#477ac7"/><rect x="5" y="5" width="3" height="3" fill="#ef6256"/><rect x="9" y="5" width="2" height="2" fill="#f0b644"/><rect x="5" y="9" width="2" height="2" fill="#61baa1"/><rect x="8" y="8" width="3" height="3" fill="#7267b5"/></svg>
<text x="396" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">Short corner returns give the C a</text>
<text x="396" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">frame-like shape.</text>
<rect x="728" y="110" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="748" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">03 · Stepped canvas</text>
<svg x="796" y="164" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="10" height="2" fill="#419ca7"/><rect x="3" y="3" width="2" height="2" fill="#419ca7"/><rect x="2" y="4" width="2" height="8" fill="#419ca7"/><rect x="3" y="11" width="2" height="2" fill="#419ca7"/><rect x="4" y="12" width="10" height="2" fill="#419ca7"/><rect x="6" y="5" width="3" height="2" fill="#ef6256"/><rect x="10" y="5" width="1" height="1" fill="#7267b5"/><rect x="5" y="8" width="2" height="2" fill="#f0b644"/><rect x="9" y="8" width="2" height="3" fill="#7267b5"/><rect x="7" y="10" width="1" height="1" fill="#ef6256"/></svg>
<text x="748" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">Pixel corners soften the C;</text>
<text x="748" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">scattered pieces add motion.</text>
<rect x="24" y="444" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="44" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">04 · Fine canvas</text>
<svg x="92" y="498" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="2" width="12" height="1" fill="#7267b5"/><rect x="2" y="3" width="1" height="10" fill="#7267b5"/><rect x="2" y="13" width="12" height="1" fill="#7267b5"/><rect x="13" y="3" width="1" height="1" fill="#7267b5"/><rect x="13" y="12" width="1" height="1" fill="#7267b5"/><rect x="5" y="5" width="3" height="3" fill="#ef6256"/><rect x="9" y="5" width="2" height="2" fill="#f0b644"/><rect x="5" y="9" width="2" height="2" fill="#419ca7"/><rect x="8" y="8" width="3" height="3" fill="#7267b5"/></svg>
<text x="44" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">A lighter frame around a compact</text>
<text x="44" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">palette mosaic.</text>
<rect x="376" y="444" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="396" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">05 · Color-block canvas</text>
<svg x="444" y="498" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="10" height="2" fill="#ef6256"/><rect x="3" y="3" width="2" height="2" fill="#ef6256"/><rect x="2" y="4" width="2" height="8" fill="#f0b644"/><rect x="3" y="11" width="2" height="2" fill="#419ca7"/><rect x="4" y="12" width="10" height="2" fill="#419ca7"/><rect x="6" y="5" width="2" height="3" fill="#7267b5"/><rect x="9" y="5" width="2" height="2" fill="#61baa1"/><rect x="5" y="9" width="2" height="2" fill="#ef6256"/><rect x="8" y="9" width="3" height="2" fill="#7267b5"/></svg>
<text x="396" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">Three colored sides make the frame</text>
<text x="396" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">itself a palette.</text>
<rect x="728" y="444" width="328" height="308" rx="12" fill="#fffdf9"/>
<text x="748" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#273342" font-weight="600">06 · Chunky canvas</text>
<svg x="796" y="498" width="192" height="192" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="2" width="11" height="3" fill="#ef6256"/><rect x="2" y="3" width="3" height="10" fill="#ef6256"/><rect x="3" y="11" width="11" height="3" fill="#ef6256"/><rect x="6" y="6" width="2" height="2" fill="#f0b644"/><rect x="10" y="6" width="2" height="2" fill="#7267b5"/><rect x="6" y="9" width="3" height="1" fill="#419ca7"/><rect x="10" y="9" width="1" height="1" fill="#dc729c"/></svg>
<text x="748" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">A bold coral C with bright, playful</text>
<text x="748" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6670" font-weight="400">pixel fragments.</text>
</svg>