<!doctype html>
<html lang="en" data-theme="dark" data-layout="top" data-panel="none">
<head>
<meta charset="utf-8">

<title>Bitify — Import / Export layout comparison</title>
<link rel="stylesheet" href="/node_modules/@jungherz-de/glasskit/glasskit.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
* { box-sizing: border-box; }
:root { --checker-a:#272e35; --checker-b:#323941; --action-surface:#272c32; --review-surface:#171d23; --review-muted:#b8c1ca; --art-ink:#f0f6f0; --art-dark:#202426; }
:root[data-theme="light"] { --checker-a:#c5cbd1; --checker-b:#d2d6da; --action-surface:#e8ecef; --review-surface:#edf0f3; --review-muted:#53616e; }
body { margin:0; color:var(--gl-color-text); font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--review-surface); background-image:conic-gradient(var(--checker-a) 25%,var(--checker-b) 0 50%,var(--checker-a) 0 75%,var(--checker-b) 0); background-size:224px 224px; background-attachment:fixed; }
button,select { font:inherit; }
button,a,select { -webkit-tap-highlight-color:transparent; }
button { color:inherit; cursor:pointer; }
a { color:inherit; text-underline-offset:3px; }
button:focus-visible,a:focus-visible,select:focus-visible { outline:2px solid var(--gl-color-primary); outline-offset:3px; }
.review-tools { padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px 16px; background:var(--review-surface); border-bottom:1px solid var(--gl-border-subtle); }
.review-title { display:flex; flex-direction:column; gap:3px; }
.review-title strong { font-size:14px; }
.review-title span { font-size:11px; color:var(--review-muted); }
.choices { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.layout-choices { display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--gl-surface-1); }
.layout-choices button,.review-choice { padding:8px 10px; border:1px solid transparent; background:transparent; border-radius:9px; font-size:12px; white-space:nowrap; }
.layout-choices button[aria-pressed="true"] { background:var(--gl-surface-5); border-color:var(--gl-border-medium); }
.review-choice { border-color:var(--gl-border-medium); }
.review-choice label { margin-right:5px; }
select { color:var(--gl-color-text); background:var(--review-surface); border:0; max-width:90px; font-size:12px; }
.live-link { font-size:12px; }
.stage { position:relative; isolation:isolate; height:calc(100dvh - 151px); min-height:520px; overflow:hidden; background:transparent; --dock-reserve:96px; --panel-reserve:0px; }
.stage[data-open="true"] { --panel-reserve:96px; }
.material { background:var(--gl-surface-2); color:var(--gl-color-text); border:1px solid var(--gl-border-medium); box-shadow:var(--gl-shadow-card),var(--gl-inset-strong); backdrop-filter:blur(var(--gl-blur)); -webkit-backdrop-filter:blur(var(--gl-blur)); }
.app-header { position:absolute; inset:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 22px; z-index:4; }
.brand { padding:5px 9px 7px; border-radius:12px; font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace; letter-spacing:-2px; font-size:30px; font-weight:700; line-height:1; }
.header-tools { display:flex; gap:10px; align-items:center; }
.file-tools { display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; }
.icon-button { display:grid; place-items:center; min-width:44px; height:44px; padding:0; border:1px solid transparent; background:transparent; border-radius:999px; position:relative; flex:none; }
.icon-button:hover { background:var(--gl-surface-4); }
.icon-button:active { background:var(--gl-surface-5); }
.icon-button svg { width:16px; height:16px; fill:currentColor; stroke:none; }
.single { background:var(--gl-surface-2); border:1px solid var(--gl-border-medium); box-shadow:var(--gl-shadow-card),var(--gl-inset-strong); backdrop-filter:blur(var(--gl-blur)); -webkit-backdrop-filter:blur(var(--gl-blur)); }
.danger { color:var(--gl-color-error-on-surface); border-color:var(--gl-color-error-border); background:linear-gradient(var(--gl-color-error-surface),var(--gl-color-error-surface)),var(--gl-surface-2); }
.danger:hover { background:linear-gradient(var(--gl-color-error-surface),var(--gl-color-error-surface)),var(--gl-surface-4); box-shadow:inset 0 0 0 1px var(--gl-color-error-border); }
.divider { height:22px; width:1px; background:var(--gl-border-subtle); margin:0 4px; }
.icon-button::after { content:attr(data-tip); position:absolute; pointer-events:none; opacity:0; top:calc(100% + 9px); right:0; width:max-content; max-width:200px; padding:7px 9px; color:var(--gl-color-text); background:var(--action-surface); border:1px solid var(--gl-border-medium); border-radius:9px; font-size:11px; z-index:20; transition:opacity .15s; }
.icon-button:hover::after,.icon-button:focus-visible::after { opacity:1; }
.art-grid { position:absolute; inset:82px 22px calc(var(--dock-reserve) + var(--panel-reserve)); display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:14px; overflow:auto; align-content:start; }
.tile { position:relative; min-width:0; min-height:120px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.art { position:relative; width:100%; min-height:0; flex:1; display:flex; align-items:center; justify-content:center; }
.art img,.sprite { image-rendering:pixelated; max-width:88%; max-height:100%; width:auto; height:100%; object-fit:contain; }
.sprite { fill:var(--art-ink); }
.sprite .dark { fill:var(--art-dark); }
.acts { position:absolute; top:5px; right:5px; display:flex; padding:3px; gap:1px; border-radius:999px; background:var(--action-surface); border:1px solid var(--gl-border-medium); box-shadow:var(--gl-shadow-card); opacity:0; transition:opacity .15s; z-index:2; }
.tile:hover .acts,.tile:focus-within .acts { opacity:1; }
.acts .icon-button { min-width:30px; height:30px; }
.acts .icon-button svg { width:14px; height:14px; }
.caption { width:100%; display:flex; justify-content:space-between; gap:6px; padding:3px 7px; border-radius:9px; font-size:12px; line-height:18px; }
.caption strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.caption span { white-space:nowrap; font-variant-numeric:tabular-nums; }
.dock { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:12px; max-width:calc(100% - 28px); z-index:5; }
.edit-island { display:flex; align-items:center; padding:5px 7px; gap:4px; border-radius:999px; }
.swatch { width:36px; height:36px; flex:none; border-radius:50%; background:var(--art-dark); box-shadow:inset 0 0 0 3px var(--gl-surface-3); border:1px solid var(--gl-border-medium); }
.swatch.light { background:var(--art-ink); }
.swap { min-width:30px; }
.view-button { display:flex; align-items:center; gap:9px; height:44px; padding:0 12px; border:1px solid transparent; background:var(--gl-surface-5); border-radius:999px; font-weight:600; font-size:13px; }
.view-dot { width:9px; height:9px; background:currentColor; border-radius:50%; }
.edit-panel { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--dock-reserve) - 8px); display:flex; align-items:center; gap:12px; width:min(730px,calc(100% - 36px)); min-height:68px; padding:12px 14px; border-radius:22px; z-index:4; }
.edit-panel[hidden] { display:none; }
.palette-title { display:flex; flex-direction:column; gap:5px; flex:none; background:transparent; font-size:12px; }
.palette-title strong { font-size:13px; }
.palette-title strong span { font-weight:400; color:var(--gl-color-text-muted); }
.mini-seg { display:flex; gap:3px; padding:3px; border-radius:7px; background:var(--gl-surface-1); }
.mini-seg span { width:18px; height:13px; border-radius:3px; background:#f0f6f0; }
.mini-seg span:nth-child(2) { background:repeating-conic-gradient(#a2a9af 0 25%,#edf0f2 0 50%) 0 0/4px 4px; }
.mini-seg span:nth-child(3) { background:linear-gradient(90deg,transparent 50%,#f0f6f0 0),repeating-conic-gradient(#a2a9af 0 25%,#edf0f2 0 50%) 0 0/4px 4px; }
.palette-list { display:flex; align-items:center; gap:9px; min-width:0; overflow:auto; padding:4px; flex:1; }
.palette-disc { width:36px; height:36px; flex:none; border-radius:50%; background:linear-gradient(135deg,var(--a) 50%,var(--b) 0); border:1px solid var(--gl-border-medium); }
.palette-disc:first-child { outline:2px solid var(--gl-color-primary); outline-offset:2px; }
.style-label { font-size:12px; color:var(--gl-color-text-muted); }
.style-pick { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--gl-border-subtle); border-radius:12px; font-size:13px; font-weight:600; }
.style-pick img { width:25px; height:25px; image-rendering:pixelated; }
.style-pick svg { width:12px; height:12px; fill:currentColor; }
.slider { height:5px; flex:1; min-width:30px; background:var(--gl-surface-3); border:1px solid var(--gl-border-medium); border-radius:999px; position:relative; }
.slider::after { content:""; position:absolute; top:50%; left:45%; transform:translateY(-50%); width:23px; height:23px; border-radius:50%; background:linear-gradient(135deg,var(--gl-color-primary),var(--gl-color-primary-dark)); border:2px solid var(--gl-border-milk); box-shadow:var(--gl-shadow-btn); }
.auto-field { display:flex; overflow:hidden; border-radius:11px; font-size:12px; border:1px solid var(--gl-border-subtle); }
.auto-field span { padding:8px; color:var(--gl-color-text-muted); }
.auto-field strong { padding:8px; background:var(--gl-surface-5); }
.bottom-files { display:none; }
:root[data-layout="bottom"] .top-files { display:none; }
:root[data-layout="bottom"] .bottom-files { display:flex; }
:root[data-layout="vertical"] .top-files { flex-direction:column; position:absolute; right:22px; top:88px; }
:root[data-layout="vertical"] .top-files .divider { width:22px; height:1px; }
:root[data-layout="vertical"] .art-grid { right:96px; }
.mobile-menu { position:absolute; right:22px; top:76px; border-radius:16px; padding:5px; display:flex; flex-direction:column; min-width:180px; z-index:8; }
.mobile-menu[hidden] { display:none; }
.mobile-menu button { display:flex; align-items:center; gap:10px; text-align:left; padding:11px; background:var(--gl-color-error-dark); border:0; border-radius:10px; color:var(--gl-color-on-error); font-size:13px; }
.mobile-menu button svg { width:14px; height:14px; fill:currentColor; }
.comparison { min-height:70px; padding:12px 20px; display:flex; justify-content:space-between; align-items:start; gap:12px; background:var(--review-surface); border-top:1px solid var(--gl-border-subtle); }
.comparison p { margin:0; font-size:12px; line-height:1.5; max-width:800px; }
.comparison strong { color:var(--gl-color-text); }
.comparison .sources { display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--review-muted); font-size:11px; flex:none; }
.sample-announcement { position:absolute; bottom:calc(var(--dock-reserve) + var(--panel-reserve) + 8px); left:50%; transform:translateX(-50%); background:var(--action-surface); padding:9px 13px; border:1px solid var(--gl-border-medium); border-radius:999px; font-size:12px; max-width:calc(100% - 32px); text-align:center; z-index:10; }
.sample-announcement:empty { display:none; }
@media (max-width:820px) { .review-tools { padding:10px 14px; } .comparison { flex-wrap:wrap; } .stage { height:calc(100dvh - 185px); } .dock { gap:8px; } :root[data-layout="bottom"] .dock { flex-wrap:wrap; width:max-content; } :root[data-layout="bottom"] .stage { --dock-reserve:154px; } }
@media (max-width:520px) {
  .review-title { width:100%; flex-direction:row; align-items:center; justify-content:space-between; }
  .review-tools { gap:8px; } .choices { gap:6px; width:100%; } .layout-choices { flex:1; }
  .layout-choices button { padding:8px 7px; flex:1; } .review-choice { padding:7px; }
  .live-link { display:none; } .stage { min-height:600px; height:calc(100dvh - 220px); --dock-reserve:144px; }
  .stage[data-open="true"] { --panel-reserve:136px; }
  .app-header { padding:14px 12px; gap:8px; } .brand { font-size:25px; padding:6px 8px; }
  .header-tools { gap:6px; } .clear-top { display:none; } .file-tools { padding:3px; }
  .art-grid { inset:82px 12px calc(var(--dock-reserve) + var(--panel-reserve)); grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(100px,1fr)); gap:12px; }
  .tile { min-height:100px; } .caption { font-size:11px; padding:2px 5px; } .caption span { font-size:10px; }
  .acts { opacity:1; top:2px; right:2px; padding:2px; } .acts .icon-button { min-width:26px; height:28px; }
  .acts .copy-action { display:none; }
  .dock { flex-wrap:wrap; width:210px; bottom:16px; gap:8px; }
  .edit-island { padding:4px 6px; } .edit-panel { width:calc(100% - 24px); bottom:calc(var(--dock-reserve) - 7px); }
  #palette-panel { flex-direction:column; align-items:stretch; gap:9px; }
  .palette-title { flex-direction:row; justify-content:space-between; align-items:center; }
  .palette-list { min-height:44px; } .palette-disc { width:36px; height:36px; }
  #style-panel { display:grid; grid-template-columns:auto 1fr auto; gap:14px 8px; }
  #style-panel[hidden] { display:none; } .style-label { grid-column:1; } .style-pick { grid-column:2 / 4; justify-self:start; }
  #style-panel .divider { display:none; } .slider { grid-column:1 / 3; } .auto-field { grid-column:3; }
  #style-panel .extra-settings { display:none; }
  :root[data-layout="bottom"] .stage { --dock-reserve:200px; }
  :root[data-layout="vertical"] .top-files { right:12px; top:88px; }
  :root[data-layout="vertical"] .art-grid { right:75px; grid-template-columns:1fr; grid-template-rows:repeat(6,120px); }
  .comparison { padding:12px 14px; } .comparison .sources { flex-wrap:wrap; font-size:10px; }
  .mobile-menu { right:12px; }
}
@media (prefers-reduced-transparency:reduce) { .material,.single { background:var(--action-surface); backdrop-filter:none; -webkit-backdrop-filter:none; } }
@media (forced-colors:active) { .material,.single,.acts { background:Canvas; color:CanvasText; border:1px solid CanvasText; } .danger { color:LinkText; } }
</style>
</head>
<body>
<section class="review-tools" aria-label="Mockup comparison controls">
  <div class="review-title"><strong>Bitify · Layout study</strong><span>Interactive mockup · file actions are samples</span></div>
  <div class="choices">
    <div class="layout-choices" role="group" aria-label="Layout candidate">
      <button data-layout-choice="top" aria-pressed="true">A · Top</button>
      <button data-layout-choice="bottom" aria-pressed="false">B · Bottom</button>
      <button data-layout-choice="vertical" aria-pressed="false">C · Vertical</button>
    </div>
    <button class="review-choice" id="theme-toggle" aria-label="Switch mockup to light theme">Light</button>
    <span class="review-choice"><label for="panel-select">Panel</label><select id="panel-select"><option value="none">None</option><option value="palette">Palette</option><option value="style">Style</option></select></span>
    <a class="live-link" href="/">Live app ↗</a>
  </div>
</section>
<main class="stage" id="stage" aria-label="Sample Bitify canvas">
  <header class="app-header">
    <div class="brand material" aria-label="Bitify">bitify</div>
    <div class="header-tools">
      <div class="file-tools material top-files" role="group" aria-label="Sample Import and Export actions">
        <button class="icon-button" data-icon="import" aria-label="Import images — sample only" data-tip="Import images · sample" data-sample="Import"></button>
        <span class="divider" aria-hidden="true"></span>
        <button class="icon-button" data-icon="save" aria-label="Export images — sample only" data-tip="Export images · sample" data-sample="Export"></button>
      </div>
      <button class="icon-button single danger clear-top" data-icon="trash" aria-label="Clear all images — sample only" data-tip="Clear all · sample" data-sample="Clear all"></button>
      <button class="icon-button single" id="more-button" data-icon="more" aria-label="Open sample More menu" aria-expanded="false" data-tip="More"></button>
    </div>
  </header>
  <div class="mobile-menu material" id="more-menu" hidden><button data-sample="Clear all"><span data-icon="trash"></span>Clear all images · sample</button></div>
  <div class="art-grid" id="art-grid"></div>
  <section class="edit-panel material" id="palette-panel" aria-label="Sample Palette panel" hidden>
    <div class="palette-title"><strong><span>Palette</span> Glow</strong><div class="mini-seg" role="img" aria-label="Sample transparent-color selector"><span></span><span></span><span></span></div></div>
    <div class="palette-list" aria-label="Sample palette swatches"></div>
  </section>
  <section class="edit-panel material" id="style-panel" aria-label="Sample Style panel" hidden>
    <span class="style-label">Style</span><div class="style-pick"><img src="/src/assets/logo.png" alt=""><span>Cutout</span><span data-icon="caret"></span></div>
    <span class="divider" aria-hidden="true"></span><div class="slider" role="img" aria-label="Sample threshold slider"></div><div class="auto-field"><span>127</span><strong>Auto</strong></div>
    <button class="icon-button extra-settings" data-icon="more" aria-label="Additional settings — sample only" data-tip="More settings · sample" data-sample="Additional settings"></button>
  </section>
  <div class="dock" aria-label="Sample editing islands">
    <div class="file-tools material bottom-files" role="group" aria-label="Sample Import and Export actions">
      <button class="icon-button" data-icon="import" aria-label="Import images — sample only" data-tip="Import images · sample" data-sample="Import"></button><span class="divider" aria-hidden="true"></span><button class="icon-button" data-icon="save" aria-label="Export images — sample only" data-tip="Export images · sample" data-sample="Export"></button>
    </div>
    <div class="edit-island material" role="group" aria-label="Colors and palette">
      <span class="swatch" aria-label="Dark sample color"></span><button class="icon-button swap" data-icon="swap" aria-label="Swap colors — sample only" data-tip="Swap colors · sample" data-sample="Swap colors"></button><span class="swatch light" aria-label="Light sample color"></span><button class="icon-button" id="palette-trigger" data-icon="grid" aria-label="Toggle Palette mockup panel" aria-expanded="false" data-tip="Palette"></button>
    </div>
    <div class="edit-island material" role="group" aria-label="Conversion and style">
      <button class="view-button" aria-label="Cutout conversion — sample only" data-sample="Original / Cutout comparison"><span class="view-dot"></span>Cutout</button><button class="icon-button" id="style-trigger" data-icon="sliders" aria-label="Toggle Style mockup panel" aria-expanded="false" data-tip="Style"></button>
    </div>
  </div>
  <div class="sample-announcement" id="sample-announcement" role="status" aria-live="polite"></div>
</main>
<section class="comparison" aria-label="Candidate explanation">
  <p id="candidate-copy"></p>
  <div class="sources"><a href="/">Live app</a><a href="https://developer.apple.com/design/human-interface-guidelines/toolbars">Apple toolbars</a><a href="https://developer.apple.com/design/human-interface-guidelines/buttons">Apple buttons</a><a href="https://glasskit.jungherz.com/docs.html">GlassKit tokens</a></div>
</section>
<script>
const root=document.documentElement, params=new URLSearchParams(location.search);
const ICONS={import:['.##....','#..####','#.....#','#..#..#','#####.#','#..#..#','#######'],save:['...#...','...#...','.#.#.#.','..###..','...#...','.......','#######'],copy:['..#####','..#...#','#####.#','#...#.#','#...###','#...#..','#####..'],x:['#.....#','.#...#.','..#.#..','...#...','..#.#..','.#...#.','#.....#'],swap:['....#..','.....#.','#######','.......','#######','.#.....','..#....'],grid:['###.###','###.###','###.###','.......','###.###','###.###','###.###'],sliders:['..##...','#######','..##...','.......','....##.','#######','....##.'],more:['...#...','.......','.......','...#...','.......','.......','...#...'],trash:['..###..','#######','.......','.#####.','.#.#.#.','.#.#.#.','.#####.'],caret:['.......','.......','...#...','..###..','.#####.','.......','.......']};
const svgIcon=name=>`<svg viewBox="0 0 7 7" width="14" height="14" aria-hidden="true">${ICONS[name].flatMap((row,y)=>[...row].flatMap((cell,x)=>cell==='#'?[`<rect x="${x}" y="${y}" width="1" height="1"/>`]:[])).join('')}</svg>`;
const sprites={
  ghost:['.....######.....','...##########...','..############..','..############..','.##############.','.###..####..###.','.###..####..###.','.##############.','.##############.','.##############.','.##############.','.##############.','.###.######.###.','.##...####...##.'],
  leaf:['.........###....','.......#####....','.....#######....','....########....','...#########....','..######.###....','..#####.####....','..####.####.....','..###.####......','...#.####.......','....###.........','...#............','..#.............'],
  castle:['.##...##...##...','.##...##...##...','.############...','.############...','...########.....','...########.....','...##.##.##.....','...##.##.##.....','...########.....','...########.....','...###..###.....','...##....##.....','...##....##.....','.############...'],
  star:['.......##.......','.......##.......','......####......','......####......','.##############.','..############..','....########....','.....######.....','....########....','....###..###....','...###....###...','...##......##...']};
const spriteSvg=name=>`<svg class="sprite" viewBox="0 0 16 16" aria-hidden="true">${sprites[name].flatMap((row,y)=>[...row].flatMap((cell,x)=>cell==='#'?[`<rect x="${x}" y="${y}" width="1" height="1"/>`]:[])).join('')}</svg>`;
const samples=[['logo.png','28 × 28','logo'],['ghost.png','16 × 16','ghost'],['leaf.png','16 × 16','leaf'],['logo-small.png','28 × 28','logo'],['castle.png','16 × 16','castle'],['star.png','16 × 16','star']];
document.getElementById('art-grid').innerHTML=samples.map(([name,size,art])=>`<article class="tile" aria-label="Sample ${name}"><div class="art">${art==='logo'?'<img src="/src/assets/logo.png" alt="Sample Bitify logo">':spriteSvg(art)}<div class="acts"><button class="icon-button copy-action" data-icon="copy" aria-label="Copy sample ${name}" data-tip="Copy · sample" data-sample="Copy"></button><button class="icon-button" data-icon="save" aria-label="Save sample ${name}" data-tip="Save · sample" data-sample="Save"></button><button class="icon-button" data-icon="x" aria-label="Remove sample ${name}" data-tip="Remove · sample" data-sample="Remove"></button></div></div><div class="caption material"><strong>${name}</strong><span>${size}</span></div></article>`).join('');
document.querySelectorAll('[data-icon]').forEach(node=>node.innerHTML=svgIcon(node.dataset.icon));
const palettes=[['#202426','#f0f6f0'],['#000','#fff'],['#45413e','#b5c6ba'],['#363121','#fce4a4'],['#293400','#90be05'],['#162810','#c2cf98'],['#304525','#ccf5d9'],['#24291f','#d5d8cb'],['#162b20','#03dc6c'],['#4a2715','#ffd15a'],['#393285','#94dce6'],['#590d28','#ffd3e0']];
document.querySelector('.palette-list').innerHTML=palettes.map(([a,b],i)=>`<span class="palette-disc" style="--a:${a};--b:${b}" role="img" aria-label="Sample palette ${i+1}"></span>`).join('');
const candidates={top:'<strong>A · Recommended: top-right Import → Export.</strong> One horizontal file group follows reading order and keeps editing space clear. Clear all stays separate on desktop and moves into More on phones. Icon meanings still require accessible names and tooltips.',bottom:'<strong>B · Bottom file island.</strong> File actions are within easier thumb reach and near the editing flow. The extra island crowds the bottom, reserves more image space, and adds a third row on narrow phones.',vertical:'<strong>C · Right-edge Import → Export.</strong> A vertical sequence makes the two steps visible, but order is less familiar, consumes canvas width, and becomes a long single-column image wall on phones.'};
let layout=['top','bottom','vertical'].includes(params.get('layout'))?params.get('layout'):'top';
let theme=['light','dark'].includes(params.get('theme'))?params.get('theme'):'dark';
let panel=['palette','style'].includes(params.get('panel'))?params.get('panel'):'none';
function update(){
  root.dataset.layout=layout;root.dataset.theme=theme;root.dataset.panel=panel;
  document.querySelectorAll('[data-layout-choice]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.layoutChoice===layout));
  const themeButton=document.getElementById('theme-toggle');themeButton.textContent=theme==='dark'?'Light':'Dark';themeButton.setAttribute('aria-label',`Switch mockup to ${theme==='dark'?'light':'dark'} theme`);
  document.getElementById('panel-select').value=panel;document.getElementById('palette-panel').hidden=panel!=='palette';document.getElementById('style-panel').hidden=panel!=='style';document.getElementById('stage').dataset.open=panel!=='none';
  document.getElementById('palette-trigger').setAttribute('aria-expanded',panel==='palette');document.getElementById('style-trigger').setAttribute('aria-expanded',panel==='style');document.getElementById('candidate-copy').innerHTML=candidates[layout];
  const url=new URL(location.href);url.searchParams.set('layout',layout);url.searchParams.set('theme',theme);url.searchParams.set('panel',panel);history.replaceState(null,'',url);
}
document.querySelectorAll('[data-layout-choice]').forEach(button=>button.addEventListener('click',()=>{layout=button.dataset.layoutChoice;update();}));
document.getElementById('theme-toggle').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';update();});
document.getElementById('panel-select').addEventListener('change',event=>{panel=event.target.value;update();});
document.getElementById('palette-trigger').addEventListener('click',()=>{panel=panel==='palette'?'none':'palette';update();});
document.getElementById('style-trigger').addEventListener('click',()=>{panel=panel==='style'?'none':'style';update();});
const moreButton=document.getElementById('more-button'),moreMenu=document.getElementById('more-menu');
moreButton.addEventListener('click',()=>{moreMenu.hidden=!moreMenu.hidden;moreButton.setAttribute('aria-expanded',!moreMenu.hidden);});
let announcementTimer;
document.querySelectorAll('[data-sample]').forEach(button=>button.addEventListener('click',()=>{const status=document.getElementById('sample-announcement');status.textContent=`${button.dataset.sample}: layout sample only. No files change.`;clearTimeout(announcementTimer);announcementTimer=setTimeout(()=>status.textContent='',2500);}));
document.addEventListener('keydown',event=>{if(event.key==='Escape'){moreMenu.hidden=true;moreButton.setAttribute('aria-expanded','false');panel='none';update();}});
update();
</script>
</body>
</html>
