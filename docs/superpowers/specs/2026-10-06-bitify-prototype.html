<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bitify Design Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: a one-screen app. The whole screen is a wall of images; every control lives in one
   floating dock at the bottom, with palettes and threshold in small panels that open above it.
   On phones the dock spans the width and its controls grow to touch size. Chrome stays neutral
   so the two chosen colors are the only strong colors on screen. */
:root{
  --bg:#ECEDF1; --surface:#FFFFFF; --fg:#1B1C24; --muted:#666979; --line:#D5D7E0;
  --tile:#E3E5EB; --tile2:#D9DBE3; --shadow:rgba(27,28,36,.16);
  --ink:#F6DFA4; --paper:#0B0A0C; --ui:#F6DFA4;
  --hit:36px;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181D; --surface:#22242C; --fg:#ECEDF2; --muted:#9A9DAE; --line:#343744;
  --tile:#1F2128; --tile2:#272A33; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181D; --surface:#22242C; --fg:#ECEDF2; --muted:#9A9DAE; --line:#343744;
  --tile:#1F2128; --tile2:#272A33; --shadow:rgba(0,0,0,.5); color-scheme:dark}
@media (pointer:coarse){:root{--hit:clamp(40px,12vw,44px)}}

html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.grow{flex:1}

#app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;min-width:0}

.bar{display:flex;align-items:center;gap:8px 12px;padding:14px 16px}
.mark{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.ico{fill:currentColor;shape-rendering:crispEdges;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--hit);min-width:var(--hit);padding:0 14px;border:1px solid var(--line);border-radius:10px;background:transparent;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn[aria-expanded="true"],.btn.sm[aria-pressed="true"]{background:var(--tile);border-color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
.ib{display:grid;place-items:center;flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.pair{display:flex;align-items:center;gap:4px}
.pair .ib{width:var(--hit);height:var(--hit);border-color:transparent;background:transparent}
.sw{position:relative;display:block;flex:none;width:var(--hit);height:var(--hit);border:1px solid var(--line);border-radius:9px;box-shadow:inset 0 0 0 2px var(--surface)}
.sw[data-k="ink"]{background:var(--ink)}
.sw[data-k="paper"]{background:var(--paper)}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sw:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.seg{display:inline-flex;height:var(--hit);padding:3px;background:var(--tile);border-radius:10px}
.seg button{padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shadow)}

/* the wall */
.grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;align-content:start;padding:8px 16px 132px}
.tile{position:relative;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;min-width:0}
.art{grid-column:1/-1;position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:conic-gradient(var(--tile2) 25%,var(--tile) 0 50%,var(--tile2) 0 75%,var(--tile) 0) 0 0/16px 16px}
.art canvas{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain;image-rendering:pixelated}
.cap{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;font-size:13px;min-width:0}
.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{margin-left:auto;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.tile:hover .acts,.tile:focus-within .acts{opacity:1}
/* touch screens have no hover: the two actions sit beside the name, always visible */
@media (hover:none){
  .acts{position:static;opacity:1;grid-column:2;grid-row:2;align-self:center}
  .acts .ib{width:40px;height:40px}
  .cap{grid-column:1;grid-row:2;flex-direction:column;align-items:flex-start;gap:0;align-self:center}
  .dim{margin-left:0}
}

.empty{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px 16px 132px;text-align:center}
.empty h2{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(26px,5vw,44px);line-height:1.1;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:38ch}
.empty-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

/* the dock */
.dock{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:10px 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px var(--shadow)}
.sep{width:1px;height:24px;background:var(--line)}
.panel{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 230px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px var(--shadow)}
.ptitle{margin:0;font-size:13px;font-weight:600}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.preset[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.chip{width:36px;height:36px;border:1px solid var(--line);border-radius:9px}
.styles{grid-template-columns:repeat(3,minmax(0,1fr))}
.demo{width:42px;height:42px;border-radius:6px;image-rendering:pixelated;background:conic-gradient(var(--tile2) 25%,var(--tile) 0 50%,var(--tile2) 0 75%,var(--tile) 0) 0 0/12px 12px}
.trow{display:flex;align-items:center;gap:10px}
#threshold{flex:1;min-width:0;height:var(--hit);margin:0;accent-color:var(--fg)}
.btn.sm{font-size:13px;padding:0 12px}
.hint{margin:0;font-size:12px;color:var(--muted)}

@media (max-width:800px){
  .dock .lbl,.sep{display:none}
  .dock .btn{padding:0}
}
@media (max-width:520px){
  .count,.bar .wide{display:none}
  .grid,.empty{padding-bottom:172px}
  .dock{left:12px;right:12px;bottom:12px;transform:none;width:auto;max-width:none;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px}
  .seg{order:5;flex:1 0 100%}
  .seg button{flex:1}
  .panel{left:0;right:0;width:auto;transform:none}
}

/* overlays */
#drop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:var(--paper);color:var(--ui);font-family:var(--display);font-size:clamp(28px,7vw,72px)}
#drop::before{content:"";position:absolute;inset:16px;border:4px dashed var(--ui)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:50%;transform:translateX(-50%);z-index:60;width:max-content;max-width:calc(100% - 32px);padding:8px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<div id="drop" hidden>Drop to bitify</div>
<div id="toast" role="status" hidden></div>
<input type="file" id="file-input" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const app = $('app'), drop = $('drop'), toastEl = $('toast'), fileInput = $('file-input');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const touch = matchMedia('(pointer:coarse)').matches;

const S = { ink:'#f6dfa4', paper:'#0b0a0c', algo:'lines', view:'bit', threshold:null, items:[], panel:null, peekId:null, peekAll:false };
const PRESETS = [['Torch','#f6dfa4','#0b0a0c'],['Citron','#262262','#e6f0b4'],['Moss','#1e3a2b','#d7e8a0'],['Plum','#3b1f3f','#f6c7b6'],
                 ['Ember','#2a1414','#ff9f45'],['Tide','#0e3b5c','#bfe9e0'],['Rose','#4a0d2b','#ffd1dc'],['Mono','#000000','#ffffff']];
const ALGOS = [['lines','Lines'],['solid','Solid'],['checker','Checker'],['bayer','Bayer'],['atkinson','Atkinson'],['silhouette','Silhouette']];

/* ---------- conversion ---------- */
const mk = (w,h) => Object.assign(document.createElement('canvas'), {width:w, height:h});
const rgb = h => { const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
const relLum = h => { const [r,g,b] = rgb(h).map(v => { v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; }); return .2126*r+.7152*g+.0722*b; };
const contrast = (a,b) => { const x=relLum(a), y=relLum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };

// splits a 256-bin histogram into two groups at the value that separates them best
function otsu(hist, fallback){
  let n = 0, sum = 0; for (let i=0; i<256; i++) { n += hist[i]; sum += i*hist[i]; }
  let sumB = 0, wB = 0, best = 0, t = fallback;
  for (let i=0; i<256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += i*hist[i];
    const v = wB*wF*(sumB/wB - (sum-sumB)/wF)**2;
    if (v > best) { best = v; t = i; }
  }
  return t;
}
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const diff = (d,i,j) => Math.max(Math.abs(d[i]-d[j]), Math.abs(d[i+1]-d[j+1]), Math.abs(d[i+2]-d[j+2]));

// one byte per pixel: 0 empty, 1 first color (lines, dark pixels), 2 second color (fill, light pixels)
function mask(it, algo, t){
  const {w, h, lum, data:d} = it, m = new Uint8Array(w*h), solid = p => d[p*4+3] >= 128;
  if (algo === 'lines') {
    // a pixel is a line when it touches empty space, or sits on the darker side of a color change
    // stronger than t. That outlines every part of a sprite, not only its silhouette.
    const N = [[1,0],[-1,0],[0,1],[0,-1]];
    for (let y=0, p=0; y<h; y++) for (let x=0; x<w; x++, p++) {
      if (!solid(p)) continue;
      m[p] = 2;
      for (const [dx,dy] of N) {
        const nx = x+dx, ny = y+dy, q = ny*w + nx;
        if (nx<0 || ny<0 || nx>=w || ny>=h) { if (it.hasAlpha) m[p] = 1; continue; }
        if (!solid(q) || (diff(d,p*4,q*4) > t && (lum[p] < lum[q] || (lum[p] === lum[q] && p < q)))) m[p] = 1;
      }
    }
    return m;
  }
  if (algo === 'atkinson') {
    const v = Float32Array.from(lum, x => x + 128 - t);
    for (let y=0, p=0; y<h; y++) for (let x=0; x<w; x++, p++) {
      if (!solid(p)) continue;
      const on = v[p] > 128, e = (v[p] - (on ? 255 : 0)) / 8; m[p] = on ? 2 : 1;
      if (x+1 < w) v[p+1] += e; if (x+2 < w) v[p+2] += e;
      if (y+1 < h) { if (x > 0) v[p+w-1] += e; v[p+w] += e; if (x+1 < w) v[p+w+1] += e; }
      if (y+2 < h) v[p+2*w] += e;
    }
    return m;
  }
  for (let y=0, p=0; y<h; y++) for (let x=0; x<w; x++, p++) {
    if (!solid(p)) continue;
    let cut = t;
    if (algo === 'checker') cut += (x+y) % 2 ? 40 : -40;
    else if (algo === 'bayer') cut += ((BAYER[(y&3)*4 + (x&3)] + .5) / 16 - .5) * 192;
    m[p] = algo === 'silhouette' ? 1 : lum[p] > cut ? 2 : 1;

  return m;
}
function bitify(it, algo = S.algo, manual = S.threshold){
  const t = manual ?? (algo === 'lines' ? it.autoLine : it.auto), key = algo + t;
  if (it.key !== key) { it.mask = mask(it, algo, t); it.key = key; }
  const c = [null, rgb(S.ink), rgb(S.paper)], out = it.octx.createImageData(it.w, it.h), o = out.data, m = it.mask;
  for (let p=0, i=0; p<m.length; p++, i+=4) if (m[p]) { const k = c[m[p]]; o[i] = k[0]; o[i+1] = k[1]; o[i+2] = k[2]; o[i+3] = 255; }
  it.octx.putImageData(out, 0, 0);
}
const redraw = () => S.items.forEach(it => bitify(it));
let uid = 0;
function makeItem(name, src, sample){
  const w = src.width, h = src.height, data = src.getContext('2d').getImageData(0,0,w,h).data;
  const lum = new Uint8Array(w*h), hist = new Array(256).fill(0), edges = new Array(256).fill(0), solid = p => data[p*4+3] >= 128;
  let hasAlpha = false;
  for (let p=0, i=0; p<w*h; p++, i+=4) {
    if (!solid(p)) { hasAlpha = true; continue; }
    hist[lum[p] = Math.round(.2126*data[i] + .7152*data[i+1] + .0722*data[i+2])]++;
    if (p % w + 1 < w && solid(p+1)) edges[diff(data, i, i+4)]++;
    if (p + w < w*h && solid(p+w)) edges[diff(data, i, i + w*4)]++;
  }
  edges[0] = 0;
  const out = mk(w,h);
  return { id:String(++uid), name, w, h, src, data, lum, hasAlpha, auto:otsu(hist,127), autoLine:otsu(edges,0), out, octx:out.getContext('2d'), sample:!!sample };
}
function addItem(name, src, sample){ const it = makeItem(name, src, sample); bitify(it); S.items.push(it); }

// a small shaded ball with a stripe, used to preview each style in the Advanced panel
function ball(){
  const s = 14, c = mk(s,s), x = c.getContext('2d');
  for (let Y=0; Y<s; Y++) for (let X=0; X<s; X++) {

    const shade = Math.hypot(X-4, Y-3) * 9, l = Math.round(r > 6 ? 25 : Y >= 7 && Y <= 9 ? 95 - shade*.4 : 240 - shade);
    x.fillStyle = `rgb(${l},${l},${l})`; x.fillRect(X,Y,1,1);
  }
  return c;

function sprite(text, pal){
  const rows = text.trim().split('\n').map(r => r.trim()), c = mk(Math.max(...rows.map(r => r.length)), rows.length), x = c.getContext('2d');
  rows.forEach((r,Y) => [...r].forEach((ch,X) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(X,Y,1,1); } }));
  return c;
}
function scene(){
  const w = 48, h = 32, c = mk(w,h), x = c.getContext('2d'), sky = ['#2d2a6e','#5b3f9a','#c85a8a','#f6a65a'];
  for (let Y=0; Y<h; Y++) for (let X=0; X<w; X++) {
    let b = Y<8 ? 0 : Y<14 ? 1 : Y<19 ? 2 : 3;
    if ((Y===8 || Y===14 || Y===19) && (X+Y)%2) b--;
    let col = sky[b];
    const dx = X-34, dy = Y-15; if (dx*dx + dy*dy <= 30) col = '#ffe9a8';
    if (Y >= 20 + Math.round(4*Math.sin(X/5) + 2*Math.sin(X/2.3))) col = '#3b2a5c';
    if (Y >= 24 + Math.round(3*Math.sin(X/7+2) + 1.5*Math.sin(X/3))) col = '#1e1638';
    if (Y >= 28) col = (X + Y*3) % 7 < 2 ? '#f6a65a' : '#2b3a7a';
    x.fillStyle = col; x.fillRect(X,Y,1,1);
  }
  x.fillStyle = '#ffe9a8'; [[4,2],[11,5],[19,1],[25,4],[41,3],[45,6],[30,2]].forEach(([X,Y]) => x.fillRect(X,Y,1,1));
  return c;
}

function syncVars(){
  const r = document.documentElement.style;
  r.setProperty('--ink', S.ink); r.setProperty('--paper', S.paper);
  // keep the drop screen readable when the two colors are nearly the same
  r.setProperty('--ui', contrast(S.ink,S.paper) >= 2.5 ? S.ink : relLum(S.paper) > .4 ? '#000000' : '#ffffff');
}
function paint(){
  for (const c of app.querySelectorAll('canvas[data-id]')) {
    const it = S.items.find(i => i.id === c.dataset.id); if (!it) continue;
    const orig = (effView() === 'orig') !== (S.peekId === it.id);
    if (c.width !== it.w || c.height !== it.h) { c.width = it.w; c.height = it.h; }
    const x = c.getContext('2d'); x.clearRect(0,0,it.w,it.h); x.drawImage(orig ? it.src : it.out, 0, 0);
  }
  for (const c of app.querySelectorAll('canvas[data-demo]')) {
    bitify(BALL, c.dataset.demo, null);
    const x = c.getContext('2d'); x.clearRect(0,0,14,14); x.drawImage(BALL.out, 0, 0);
  }
}
function focusKey(el){
  if (!el || !app.contains(el)) return null;
  if (el.id) return '#' + el.id;
  for (const k of ['view','act','preset','algo','panel']) if (el.dataset[k] != null) return `[data-${k}="${el.dataset[k]}"]` + (el.dataset.id ? `[data-id="${el.dataset.id}"]` : '');
  return null;
}
function render(){
  const key = focusKey(document.activeElement);
  app.innerHTML = view();
  syncVars(); paint();
  if (key) app.querySelector(key)?.focus();
}
// closes without a re-render, so a color picker opened by the same click keeps its input
function closePanel(){
  S.panel = null; app.querySelector('.panel')?.remove();
  app.querySelectorAll('[data-panel]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
let raf = 0;
function recolor(){ syncVars(); if (!raf) raf = requestAnimationFrame(() => { raf = 0; redraw(); paint(); }); }

let toastTimer;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.hidden = true, 3200); }

/* ---------- adding and saving ---------- */
async function addFiles(files){
  let skipped = 0;
  for (const f of files) {
    try { if (!f.type.startsWith('image/')) throw 0;
      const bmp = await createImageBitmap(f), c = mk(bmp.width, bmp.height);
      c.getContext('2d').drawImage(bmp, 0, 0); addItem(f.name, c);
    } catch { skipped++; }
  }
  render();
  if (skipped) toast(`${skipped} file${skipped===1 ? '' : 's'} skipped. Bitify reads PNG, GIF, WebP, JPEG and BMP images.`);
}
const downloads = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
const blobOf = it => new Promise(r => it.out.toBlob(r, 'image/png'));
const outName = (it, used = {}) => { const b = it.name.replace(/\.[^.]+$/, ''); used[b] = (used[b] || 0) + 1; return `${b}${used[b] > 1 ? '-' + used[b] : ''}-1bit.png`; };
async function save(filename, blob){
  const dl = await downloads;
  if (dl) {
    try { await dl.save({filename, data:blob}); toast('Saved ' + filename); }
    catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? 'Answer the open save prompt first.' : 'Saving is not available in this view.'); }
    return;
  }
  if (window.claude) return toast('Saving is not available in this view.');
  const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:filename});
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function saveAll(){
  if (!S.items.length) return;
  if (typeof JSZip === 'undefined') return toast('The zip library did not load. Download images one at a time.');
  const zip = new JSZip(), used = {};
  for (const it of S.items) zip.file(outName(it, used), await blobOf(it));
  save('bitify.zip', await zip.generateAsync({type:'blob'}));
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  if (S.panel && !e.target.closest('.dock')) closePanel();
  const t = e.target.closest('[data-view],[data-act],[data-preset],[data-algo],[data-panel]'); if (!t) return;
  const d = t.dataset;
  if (d.algo) { S.algo = d.algo; redraw(); return render(); }
  if (d.panel) { S.panel = S.panel === d.panel ? null : d.panel; return render(); }
  if (d.view) { S.view = d.view; return render(); }
  if (d.preset) { [, S.ink, S.paper] = PRESETS[+d.preset]; redraw(); return render(); }
  const it = S.items.find(i => i.id === d.id);
  switch (d.act) {
    case 'add': fileInput.click(); break;
    case 'samples': await loadSamples(); render(); break;
    case 'clear': S.items = []; render(); break;
    case 'swap': [S.ink, S.paper] = [S.paper, S.ink]; redraw(); render(); break;
    case 'auto': S.threshold = null; redraw(); render(); break;
    case 'remove': S.items = S.items.filter(i => i !== it); render(); break;
    case 'save': if (it) save(outName(it), await blobOf(it)); break;
    case 'saveall': saveAll(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.color) { S[t.dataset.color] = t.value; recolor(); }
  else if (t.id === 'threshold') {
    S.threshold = +t.value; $('thr-hint').textContent = thrHint();
    app.querySelector('[data-act="auto"]').setAttribute('aria-pressed', 'false'); recolor();
  }
});
fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

app.addEventListener('pointerdown', e => { const p = e.target.closest('[data-peek]'); if (p) { S.peekId = p.dataset.peek; paint(); } });
for (const n of ['pointerup','pointercancel']) window.addEventListener(n, () => { if (S.peekId) { S.peekId = null; paint(); } });
app.addEventListener('contextmenu', e => { if (e.target.closest('[data-peek]')) e.preventDefault(); });

const typing = e => /^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(e.target.tagName);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.panel) closePanel();
  else if (e.code === 'Space' && !typing(e)) { e.preventDefault(); if (!e.repeat) { S.peekAll = true; paint(); } }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && S.peekAll) { S.peekAll = false; paint(); } });

let depth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { e.preventDefault(); depth++; drop.hidden = false; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; drop.hidden = true; } });
window.addEventListener('drop', e => { e.preventDefault(); depth = 0; drop.hidden = true; if (e.dataTransfer?.files.length) addFiles([...e.dataTransfer.files]); });
window.addEventListener('paste', e => { if (e.clipboardData?.files.length) addFiles([...e.clipboardData.files]); });

render();
loadSamples().then(render);
</script>

</body></html>
