<!doctype html>

<title>Bitify palette integration checks</title>
<style>body{margin:0;background:#202630;color:#fff;font:14px system-ui}header{padding:12px}button{font:inherit;padding:8px}iframe{display:block;width:100%;height:78vh;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;margin:0}</style>
<header><button id="run">Run integration checks</button> <button id="cancel" disabled>Cancel</button><span id="status"> Ready. Uses the built app and fixture files on this server.</span></header>
<iframe id="app" title="Production Bitify under test"></iframe><pre id="out"></pre>
<script type="module">

async function until(fn,message,timeout=15000){const start=performance.now();while(!fn()){check();assert(performance.now()-start<timeout,message);await sleep(30);}return fn();}
async function record(name,fn){check();status.textContent=' '+name;const begin=performance.now();try{const details=await fn();report.checks.push({name,pass:details?.manualViewerValidationRequired?null:true,ms:performance.now()-begin,...details});}catch(error){report.checks.push({name,pass:false,message:error.message,ms:performance.now()-begin});throw error;}await publish();}
async function publish(){const text=JSON.stringify(report);assert(text.length<1024*1024,'Report exceeds1MiB');out.textContent=JSON.stringify(report,null,2);await fetch('/results',{method:'POST',headers:{'Content-Type':'application/json'},body:text});}
async function fileFor(entry){const response=await fetch(entry.url);assert(response.ok,'Fixture fetch '+entry.url);return new w.File([await response.arrayBuffer()],entry.name??entry.id,{type:response.headers.get('Content-Type')??''});}
async function filesInput(node,files){const transfer=new w.DataTransfer();files.forEach(file=>transfer.items.add(file));node.files=transfer.files;node.dispatchEvent(new w.Event('change',{bubbles:true}));await sleep(40);}
async function addFiles(entries){const before=all('.tiles > .tile:not(:has(.example-caption))').length;await filesInput($('input[type=file][multiple]'),await Promise.all(entries.map(fileFor)));await until(()=>all('.tiles > .tile:not(:has(.example-caption))').length===before+entries.length,'Images did not load',30000);await sleep(80);}
async function clear(){if(!all('.tiles > .tile:not(:has(.example-caption))').length)return;click(byLabel('Remove all images'));await until(()=>$('dialog[open][aria-labelledby="clear-title"]'),'Remove confirmation');click(buttonText('Remove',$('dialog[open][aria-labelledby="clear-title"]')));await until(()=>!!$('.example-caption'),'Wall did not clear');}
async function palettePanel(){if(!$('.palette-family-panel')){click(byLabel('Palette'));await until(()=>!!$('.palette-family-panel'),'Palette panel');}}
async function full(){await palettePanel();const b=buttonText('Palette',$('.palette-family-tabs'));if(b.getAttribute('aria-pressed')!=='true')click(b);await sleep(30);}
async function preset(name){await full();configuredAt=performance.now();click(byLabel(name,$('.palette-rail')));await until(()=>byLabel(name,$('.palette-rail'))?.getAttribute('aria-pressed')==='true','Preset selection');}
async function settings(){if(!$('.palette-settings-panel')){click(byLabel('Palette settings'));await until(()=>!!$('.palette-settings-panel'),'Palette settings');}}
async function configure(metric,cap,cleanup){await settings();const n=byLabel('Max colors value'),allButton=byLabel('Use all palette colors'),desired=cap==='All'?null:Math.min(cap,Number(n.max)),changed=byLabel(metric+' matching').getAttribute('aria-pressed')!=='true'||byLabel('Cleanup '+cleanup).getAttribute('aria-pressed')!=='true'||(cap==='All'?allButton.getAttribute('aria-pressed')!=='true':allButton.getAttribute('aria-pressed')==='true'||Number(n.value)!==desired);if(changed)configuredAt=performance.now();click(byLabel(metric+' matching'));click(byLabel('Cleanup '+cleanup));if(cap==='All')click(allButton);else if(!n.disabled){input(n,desired);n.dispatchEvent(new w.Event('change',{bubbles:true}));}await sleep(50);}
function snapshotCanvas(canvas){const data=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,colors=new Set();let visiblePixels=0;for(let p=0;p<data.length;p+=4)if(data[p+3]){visiblePixels++;colors.add('#'+(data[p]*65536+data[p+1]*256+data[p+2]).toString(16).padStart(6,'0'));}return{colors,visiblePixels,width:canvas.width,height:canvas.height};}
async function paletteColors(){await palettePanel();await until(()=>!byLabel('Edit palette')?.disabled,'Palette still preparing',30000);click(byLabel('Edit palette'));await until(()=>!!$('.palette-import-modal[open]'),'Palette copy');const colors=[];for(let page=0;page<4;page++){colors.push(...all('.palette-import-modal .palette-review-swatch').map(b=>b.getAttribute('aria-label').match(/#[a-f\d]{6}$/)?.[0]).filter(Boolean));const next=buttonText('Next',$('.palette-import-modal'));if(!next||next.disabled)break;click(next);await sleep(20);}click(byLabel('Close palette editor'));await until(()=>!$('.palette-import-modal'),'Editor closed');assert(colors.length>0&&colors.length<=256,'Unexpected reviewed palette');return colors;}

function overflow(){const width=d.documentElement.clientWidth,issues=[];for(const node of all('.workspace-tools,.palette-settings-panel,.palette-family-panel,.palette-import-modal .glass-modal,.image-viewer[open]'))if(visible(node)){const r=node.getBoundingClientRect();if(r.left<-.5||r.right>width+.5)issues.push({selector:node.className,left:r.left,right:r.right,width});}assert(d.documentElement.scrollWidth<=width+1,'Page horizontal overflow');assert(!issues.length,'Control horizontal overflow '+JSON.stringify(issues));return{viewport:width};}
async function exportAndCheck(allowed, cap) {
  const before = blobs.length, allButton = byLabel('Save all images');
  const expectedType = allButton ? 'application/zip' : null;
  downloadContext = 'image-export';
  try {
    click(allButton ?? byLabel('Save image'));
    const entry = await until(() => blobs.slice(before).find(entry => expectedType
      ? entry.blob.type.split(';')[0] === expectedType
      : /^image\/(png|gif)$/.test(entry.blob.type.split(';')[0])),
      'Export did not create the actual image/ZIP file', 30000);
    const blob = entry.blob;
    assert(blob.size > 0, 'Empty export');
    const header = [...new Uint8Array(await blob.slice(0, 12).arrayBuffer())];
    if (expectedType) assert(header[0] === 80 && header[1] === 75 && header[2] === 3 && header[3] === 4, 'Export blob is not a ZIP archive');
    let rawCaptured = false;
    if (exportOnly && expectedType) {
      const device = /Android/.test(navigator.userAgent) ? 'android' : 'desktop';
      const response = await fetch('/export?device=' + device, {
        method: 'POST', headers: { 'Content-Type': 'application/zip' }, body: blob,
      });

      assert(capture.filename === device + '-export.zip' && capture.bytes === blob.size, 'Local ZIP capture metadata mismatch');

      report.rawExport = { type: blob.type, bytes: blob.size, capturedFile: capture.filename, selectedColors: allowed, cap };

      const bytes = new Uint8Array(await blob.arrayBuffer());
      let text = '';
      for (let at = 0; at < bytes.length; at += 4096) text += String.fromCharCode(...bytes.subarray(at, at + 4096));

      report.rawExport = { type: blob.type, bytes: blob.size, base64: btoa(text), selectedColors: allowed, cap };

      report.rawExport = { type: blob.type, bytes: blob.size, rawCaptured: false, header, selectedColors: allowed, cap };
    }
    return { type: blob.type, bytes: blob.size, rawCaptured };
  } finally { downloadContext = ''; }
}
