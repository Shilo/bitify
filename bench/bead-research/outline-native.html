<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outline research comparisons</title><style>body{font:16px system-ui;background:#f5f2ed;color:#252229;margin:20px}p{line-height:1.5}select{font:inherit;max-width:100%;padding:8px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;padding:8px;background:white}img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#e3dfd7}figcaption{margin-bottom:8px}@media(max-width:650px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>Outline research comparisons</h1><p>Private local comparisons of frozen hypotheses. This gallery displays precomputed native PNGs. It does not execute the algorithms or validate production exports. Real sprites have no artist-approved corrected target.</p><label>Source <select id="case" aria-label="Outline comparison"></select></label><section id="panels"></section><p id="metrics"></p><script type="module">
const base='/.tmp/bead-research-private/outline/',response=await fetch(base+'gallery.json');if(!response.ok)document.querySelector('#metrics').textContent='Private research outputs are unavailable.';else{const cards=await response.json(),records=(await(await fetch('./outline-native-results.json')).json()).rows,choice=document.querySelector('#case');for(const c of cards){const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' — '+c.group;choice.append(o);}function update(){const c=cards.find(c=>c.id===choice.value),panels=document.querySelector('#panels');panels.replaceChildren();for(const m of c.methods){const f=document.createElement('figure'),label=document.createElement('figcaption'),img=document.createElement('img');label.textContent=m.name;img.src=base+m.file;img.alt=c.id+' '+m.name;f.append(label,img);panels.append(f);}document.querySelector('#metrics').textContent=records.filter(r=>r.id===c.sourceId&&r.variant===c.variant).map(r=>r.method+': '+r.changed+' changed, alpha +'+r.added+'/-'+r.removed).join(' | ');}choice.onchange=update;choice.value='latest-raw';update();}
</script></html>
