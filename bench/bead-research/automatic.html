<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automatic Cleanup research</title><style>body{font:16px system-ui,sans-serif;background:#f5f2ed;color:#252229;margin:24px}h1{font-size:25px}p{line-height:1.5}select{font:inherit;padding:8px;margin:8px}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}figure{margin:0;padding:10px;background:white;border-radius:8px}img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#e3dfd7}figcaption{margin-bottom:8px}#note{padding:12px;background:#fff0c8}@media(max-width:650px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>Automatic Cleanup research</h1><p id="note">Research only. No selected colors or protection masks. All artwork stays in ignored local storage. Strict and balanced are fixed experimental rules; neither recognizes faces or artistic intent.</p><label>Comparison <select aria-label="Automatic comparison" id="case"></select></label><section id="panels"></section><p id="metrics"></p><script type="module">
const base='/.tmp/bead-research-private/automatic/',response=await fetch(base+'automatic-gallery.json');if(!response.ok){document.querySelector('#metrics').textContent='Private local research inputs are unavailable.';}else{
const cards=await response.json(),records=(await(await fetch('./automatic-results.json')).json()).rows,choice=document.querySelector('#case');for(const card of cards){const o=document.createElement('option');o.value=card.id;o.textContent=card.id+' — '+card.group;choice.append(o);}function update(){const c=cards.find(c=>c.id===choice.value),panel=document.querySelector('#panels');panel.replaceChildren();for(const m of c.methods){const f=document.createElement('figure'),caption=document.createElement('figcaption'),im=document.createElement('img');caption.textContent=m.name;im.src=base+m.file;im.alt=c.id+' '+m.name;f.append(caption,im);panel.append(f);}document.querySelector('#metrics').textContent=records.filter(r=>r.id===c.sourceId&&r.variant===c.variant).map(r=>r.preset+': '+r.changed+' changed; small-region pixels '+r.baselineSmallPixels+' → '+r.afterSmallPixels+'; dark-mask additions/removals '+r.darkAdded+'/'+r.darkRemoved+(r.keepChanged!==null?'; annotated keep pixels changed '+r.keepChanged:'')).join(' | ');}choice.onchange=update;choice.value='snowie-bead24';update();}
</script></html>
