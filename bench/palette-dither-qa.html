<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorfetti dithering acceptance checks</title>
<style>body{margin:0;font:14px system-ui;background:#eee;color:#151515}header,pre{padding:10px}button{padding:10px;font:inherit}iframe{width:100%;height:78vh;border:0;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><button id="run">Run dithering checks</button> <span id="status">Ready</span></header><iframe id="app" title="Production Colorfetti"></iframe><pre id="out"></pre>
<script type="module">
const frame=document.querySelector('#app'),run=document.querySelector('#run'),status=document.querySelector('#status'),out=document.querySelector('#out');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let w,d,report,artifacts,painted,changed,observer;
const assert=(v,m)=>{if(!v)throw Error(m);};
const all=s=>[...d.querySelectorAll(s)],label=(s,root=d)=>root.querySelector('[aria-label="'+CSS.escape(s)+'"]'),click=n=>{assert(n,'Missing control');assert(!n.disabled,'Control disabled '+n.getAttribute('aria-label'));n.click();};
const input=(n,value,event='input')=>{assert(n,'Missing input');n.value=value;n.dispatchEvent(new w.Event(event,{bubbles:true}));};
async function until(test,message,timeout=20000){const start=performance.now();while(!test()){assert(performance.now()-start<timeout,message);await sleep(25);}return test();}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),body=await r.json();if(!r.ok)throw Error(body.error);return body;}
async function publish(){out.textContent=JSON.stringify(report,null,2);await post('/report',report);}
async function check(name,action){status.textContent=name;const start=performance.now();const result=await action();report.checks.push({name,pass:true,ms:Math.round(performance.now()-start),...result});await publish();}
function controlsFit(){const width=d.documentElement.clientWidth,issues=[];for(const n of all('.palette-settings-panel,.palette-setting-row,.workspace-tools')){if(!n.getClientRects().length)continue;const r=n.getBoundingClientRect();if(r.left<-.5||r.right>width+.5)issues.push({class:n.className,left:r.left,right:r.right});}assert(d.documentElement.scrollWidth<=width+1&&!issues.length,'Horizontal overflow '+JSON.stringify(issues));return{width};}
async function settings(){if(!d.querySelector('.palette-settings-panel')){click(label('Palette settings'));await until(()=>d.querySelector('.palette-settings-panel'),'Settings did not open');}}
async function configure(s){await settings();changed=performance.now();click(label(s.metric==='rgb'?'RGB matching':'Oklab matching'));click(label(s.cleanup?'Cleanup on':'Cleanup off'));if(s.maxColors){const field=label('Max colors value');input(field,String(s.maxColors));field.dispatchEvent(new w.Event('change',{bubbles:true}));}else click(label('Use all palette colors'));click(label(s.dither==='none'?'Dithering off':'Dithering '+s.dither));if(s.dither!=='none'){await until(()=>label('Dithering amount'),'Amount did not appear');input(label('Dithering amount'),String(s.ditherStrength));label('Dithering amount').dispatchEvent(new w.Event('change',{bubbles:true}));}await until(()=>{const stored=JSON.parse(w.localStorage.getItem('colorfetti'));return stored.dither===s.dither&&stored.ditherStrength===s.ditherStrength;},'Committed dither settings missing');}
async function verifyPaints(s,viewer=false){const tiles=viewer?all('.image-viewer[open] .tile'):all('.tiles > .tile');assert(tiles.length,'No tiles');const start=performance.now();for(;;){try{const checks=[];for(const tile of tiles){const name=['ramp','sprite','clip'].find(n=>tile.textContent.includes(n))??(viewer?'ramp':null),p=painted.get(tile.querySelector('canvas'));assert(name&&p,'Missing converted paint');checks.push(await post('/paint',{name,width:p.width,height:p.height,rgba:[...p.data],settings:s}));}return{paintChecks:checks.length,...controlsFit()};}catch(error){if(performance.now()-start>20000)throw error;await sleep(40);}}}
function b64(bytes){let text='';for(let at=0;at<bytes.length;at+=4096)text+=String.fromCharCode(...bytes.subarray(at,at+4096));return btoa(text);}
async function verifyArtifact(artifact,s){return post('/verify',{name:artifact.name,type:artifact.blob.type,base64:b64(new Uint8Array(await artifact.blob.arrayBuffer())),settings:s});}
async function zip(s,mutate){const at=artifacts.length;click(label('Save all images'));if(mutate)await mutate();const artifact=await until(()=>artifacts.slice(at).find(a=>a.blob.type==='application/zip'),'ZIP not produced');return{exports:await verifyArtifact(artifact,s)};}
async function add(){const files=[];for(const name of ['ramp.png','sprite.png','clip.gif']){const r=await fetch('/fixtures/'+name);files.push(new w.File([await r.arrayBuffer()],name,{type:r.headers.get('content-type')}));}const transfer=new w.DataTransfer();files.forEach(f=>transfer.items.add(f));const node=d.querySelector('input[type=file][multiple]');node.files=transfer.files;node.dispatchEvent(new w.Event('change',{bubbles:true}));await until(()=>all('.tiles > .tile').length===3,'Fixture import failed');}
run.onclick=async()=>{if(run.disabled)return;run.disabled=true;report={userAgent:navigator.userAgent,checks:[],errors:[],longTasks:[],started:new Date().toISOString()};artifacts=[];painted=new WeakMap();try{
await new Promise(resolve=>{frame.onload=resolve;frame.src='/app/';});w=frame.contentWindow;d=w.document;await until(()=>label('Palette settings'),'App not ready');
w.addEventListener('error',e=>{if(!e.message.startsWith('ResizeObserver loop'))report.errors.push(e.message);});w.addEventListener('unhandledrejection',e=>report.errors.push(String(e.reason)));
const put=w.CanvasRenderingContext2D.prototype.putImageData;w.CanvasRenderingContext2D.prototype.putImageData=function(im,...args){if(this.canvas.closest('.tile'))painted.set(this.canvas,{width:im.width,height:im.height,data:im.data.slice(),at:performance.now()});return put.call(this,im,...args);};
const create=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=blob=>{const href=create(blob);if(['application/zip','image/png','image/gif'].includes(blob.type))artifacts.push({blob,href});return href;};
const anchor=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download&&this.href.startsWith('blob:')){const a=artifacts.find(a=>a.href===this.href);if(a)a.name=this.download;return;}return anchor.call(this);};
if(w.navigator.clipboard)Object.defineProperty(w.navigator.clipboard,'write',{configurable:true,value:async items=>{for(const item of items){const blob=await item.getType('image/png');artifacts.push({blob,name:'ramp-palette.png',copy:true});}}});
try{observer=new w.PerformanceObserver(list=>{for(const e of list.getEntries())report.longTasks.push({ms:e.duration,phase:status.textContent});});observer.observe({type:'longtask',buffered:false});}catch{}
await check('Fresh full-palette defaults are off',async()=>{await settings();assert(label('Dithering off').getAttribute('aria-pressed')==='true','Dither enabled by default');assert(!label('Dithering amount'),'Amount visible while Off');return controlsFit();});
await check('Import original stills and animation',async()=>{changed=performance.now();await add();return{tiles:3};});
const base={paletteId:'preset-pico8',metric:'oklab',maxColors:0,cleanup:false,dither:'none',ditherStrength:50};
const configs=[base,...['2x2','4x4','8x8'].flatMap(dither=>[0,50,100].map(ditherStrength=>({...base,dither,ditherStrength}))),{...base,dither:'4x4',ditherStrength:60,metric:'rgb',maxColors:8,cleanup:true}];
for(const s of configs)await check('Pixels and native ZIP '+JSON.stringify(s),async()=>{await configure(s);const paints=await verifyPaints(s);return{...paints,...await zip(s)};});
const selected={...base,dither:'8x8',ditherStrength:75};
await check('Rapid settings use only latest conversion',async()=>{await configure({...base,dither:'2x2',ditherStrength:100});await configure({...base,dither:'4x4',ditherStrength:10});await configure(selected);return verifyPaints(selected);});
await check('ZIP owns settings across later edits',async()=>{await configure(selected);return zip(selected,()=>configure({...base,dither:'2x2',ditherStrength:30}));});
await check('Copy uses native dithered PNG',async()=>{await configure(selected);await verifyPaints(selected);const at=artifacts.length;const tile=all('.tiles > .tile').find(t=>t.textContent.includes('ramp.png'));const copy=label('Copy ramp.png',tile);if(copy)click(copy);else{click(label('Share ramp.png',tile));await until(()=>label('Copy image'),'Share sheet');click(label('Copy image'));}const artifact=await until(()=>artifacts.slice(at).find(a=>a.copy),'Clipboard image not produced');return{export:await verifyArtifact(artifact,selected)};});
await check('Enlarged preview and its Save agree with wall/export',async()=>{click(label('Preview ramp.png'));await until(()=>d.querySelector('.image-viewer[open]'),'Viewer did not open');await verifyPaints(selected,true);click(label('Show original image',d.querySelector('.image-viewer')));await sleep(40);click(label('Show converted image',d.querySelector('.image-viewer')));await verifyPaints(selected,true);const at=artifacts.length;click(label('Save image',d.querySelector('.image-viewer')));const artifact=await until(()=>artifacts.slice(at).find(a=>a.blob.type==='image/png'),'Viewer PNG missing');const result=await verifyArtifact(artifact,selected);click(label('Close preview'));await until(()=>!d.querySelector('.image-viewer[open]'),'Viewer did not close');return{export:result};});
await check('1-bit styles remain separate and retain full-palette choices',async()=>{click(label('Palette'));await until(()=>d.querySelector('.palette-family-tabs'),'Palette panel missing');click([...d.querySelectorAll('.palette-family-tabs button')].find(b=>b.textContent.trim()==='1-bit'));await sleep(30);assert(!label('Dithering 4x4'),'Full-palette dither in1bit UI');click([...d.querySelectorAll('.palette-family-tabs button')].find(b=>b.textContent.trim()==='Palette'));await until(()=>label('Palette settings'),'Full palette family return');await settings();assert(label('Dithering 8x8').getAttribute('aria-pressed')==='true','Dither lost on family return');assert(JSON.parse(w.localStorage.getItem('colorfetti')).ditherStrength===75,'Amount lost across families');return controlsFit();});
await check('Committed dithering persists through reload',async()=>{await new Promise(resolve=>{frame.onload=resolve;frame.src='/app/?keep=1';});w=frame.contentWindow;d=w.document;await until(()=>label('Palette settings'),'Reload failed');await settings();assert(label('Dithering 8x8').getAttribute('aria-pressed')==='true','Persisted dither missing');assert(label('Dithering amount').value==='75','Persisted amount missing');return controlsFit();});
await check('Reset restores Off and amount50',async()=>{await settings();click(label('Reset palette settings'));await until(()=>label('Dithering off').getAttribute('aria-pressed')==='true','Reset did not disable dither');assert(JSON.parse(w.localStorage.getItem('colorfetti')).ditherStrength===50,'Reset amount');return controlsFit();});
assert(!report.errors.length,'Runtime errors '+JSON.stringify(report.errors));report.completed=true;status.textContent='PASS';
}catch(e){report.completed=false;report.error={message:e.message,stack:e.stack};status.textContent='FAIL: '+e.message;}finally{observer?.disconnect();report.finished=new Date().toISOString();await publish();run.disabled=false;}};
</script>
