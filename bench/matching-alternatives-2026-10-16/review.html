<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alternative palette matching research</title>
<style>body{font:16px/1.45 system-ui,sans-serif;margin:20px;background:#faf8f5;color:#25242a}h1{font-size:25px;margin:0}p{max-width:1100px}header{position:sticky;top:0;background:#faf8f5f2;z-index:2;padding:10px 0}label{display:inline-block;margin-right:14px}select,button{font:inherit;padding:8px;max-width:310px}#swatches{display:flex;gap:2px;margin-top:12px}#swatches span{width:20px;height:20px;border:1px solid #888}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:10px}figure{padding:10px;background:white;border:1px solid #ddd;border-radius:8px;margin:0}figcaption{font-weight:650;margin-bottom:4px}canvas{width:100%;height:200px;object-fit:contain;image-rendering:pixelated;background:conic-gradient(#eee 25%,#ccc 0 50%,#eee 0 75%,#ccc 0) 0 0/16px 16px}small{display:block;color:#555}#status{white-space:pre-wrap;margin:10px 0}</style>
<style>canvas{height:136px}</style>
<h1>Alternative palette matching research</h1><p>Review only · original source pixels · All colors · Cut128 · Cleanup Off · Dithering Off. Compare hue, material identity, shading and small details. DE00 and CAM16-UCS are separate diagnostics; each favors its own nearest matcher.</p>
<header><label>Image <select id="source" aria-label="Image"></select></label><label>Palette <select id="palette" aria-label="Palette"></select></label><label>Methods <select id="methods" aria-label="Methods"><option value="short">Shortlist</option><option value="all">All 20 methods</option></select></label><button id="verify">Verify in this browser</button><div id="swatches"></div></header><div id="status" role="status">Loading…</div><main id="grid"></main>
<script type="module">
import {MODES,LABELS,clearCaches,makeMatcher,analyze,mapping,paint,feature,inSpace,point,score,deltaE2000,Color} from './engine.js';
import {prepareCiede,ciedeSquared} from './ciede-kernel.js';
import {quantize} from '/src/lib/quantize.js';import {decodeImageFile} from '/src/lib/image-decode.js';
const d=await(await fetch('./output/results.json')).json(),source=document.querySelector('#source'),palette=document.querySelector('#palette'),methods=document.querySelector('#methods'),grid=document.querySelector('#grid'),status=document.querySelector('#status');let token=0;
for(const s of d.sources)source.add(new Option(`${s.id} · ${s.width}×${s.height}`,s.id));for(const p of d.palettes)palette.add(new Option(p.name,p.id));const params=new URLSearchParams(location.search);source.value=params.get('source')||'general';palette.value=params.get('palette')||'preset-edg32';
const decode=async s=>{const b=await(await fetch('./output/'+s.sourceFile)).blob();return decodeImageFile(new File([b],s.sourceFile,{type:'image/png'}));};
const hash=async bytes=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function show(){const own=++token,s=d.sources.find(s=>s.id===source.value),p=d.palettes.find(p=>p.id===palette.value),image=await decode(s),a=analyze(image);if(own!==token)return;grid.replaceChildren();document.querySelector('#swatches').replaceChildren(...p.colors.map(c=>{const x=document.createElement('span');x.style.background=c;return x;}));const modes=methods.value==='all'?MODES:['oklab','rgb','ok2','ciede2000','cam16ucs','hue4','edge-aware'];
 for(const mode of ['source',...modes]){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),c=document.createElement('canvas'),small=document.createElement('small');cap.textContent=mode==='source'?'Original':LABELS[mode];c.width=image.width;c.height=image.height;c.setAttribute('aria-label',`${s.id}, ${mode}`);const im=mode==='source'?image:paint(a,p.colors,mapping(a,p.colors,mode));c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(im.data),image.width,image.height),0,0);const r=d.rows.find(r=>r.source===s.id&&r.palette===p.id&&r.mode===mode);small.textContent=r?`${r.used} colors · ${(r.changed*100).toFixed(1)}% changed · DE00 ${r.DE00.toFixed(2)} · CAM ${r.CAM.toFixed(2)}`:'Native PNG decode';fig.append(cap,c,small);grid.append(fig);}
 status.textContent=`${s.id} / ${p.name} · ${d.rows.length.toLocaleString()} measured renders · ${s.intent||'All methods preserve exact target-palette source colors.'}`;history.replaceState(null,'',`?source=${source.value}&palette=${palette.value}`);
}
source.onchange=palette.onchange=methods.onchange=show;await show();
document.querySelector('#verify').onclick=async()=>{document.querySelector('#verify').disabled=true;const receipt={userAgent:navigator.userAgent,date:new Date().toISOString(),baselineParity:0,candidateHashes:0,alpha:0,decode:0,ciedeReference:0,failures:[],performance:[],kernels:[]};
 try{
 for(const s of d.sources){const image=await decode(s),raw=new Uint8Array(await(await fetch(`./output/${s.id}.rgba`)).arrayBuffer());let diffs=0;for(let i=0;i<raw.length;i++)if(raw[(i>>2)*4+3]>0&&raw[i]!==image.data[i])diffs++;if(diffs)receipt.failures.push('decode/'+s.id);else receipt.decode++;const a=analyze(image);
  for(const p of d.palettes)for(const mode of ['oklab','rgb']){const im=paint(a,p.colors,mapping(a,p.colors,mode)),ref=quantize(image,p.colors,128,undefined,undefined,{metric:mode});if(im.indices.some((x,i)=>x!==ref.indices[i]))receipt.failures.push('baseline/'+s.id+'/'+p.id+'/'+mode);else receipt.baselineParity++;}
  const p=d.palettes.find(p=>p.id==='preset-edg32');for(const mode of MODES){const im=paint(a,p.colors,mapping(a,p.colors,mode)),expected=d.rows.find(r=>r.source===s.id&&r.palette===p.id&&r.mode===mode);if(await hash(im.data)!==expected.hash)receipt.failures.push('hash/'+s.id+'/'+mode);else receipt.candidateHashes++;
   const k=analyze(image,{keep:true}),kept=paint(k,p.colors,mapping(k,p.colors,mode),{keep:true});if(kept.data.some((x,i)=>i%4===3&&x!==image.data[i]))receipt.failures.push('alpha/'+s.id+'/'+mode);else receipt.alpha++;
  }
  if(['general','town'].includes(s.id))for(const mode of MODES.filter(m=>m!=='oklch-equivalent')){const times=[];for(let j=0;j<7;j++){const t=performance.now();const map=mapping(a,p.colors,mode);paint(a,p.colors,map);times.push(performance.now()-t);}times.sort((a,b)=>a-b);receipt.performance.push({source:s.id,mode,medianMs:times[3],unique:a.hist.size});}
  status.textContent=`Verifying ${s.id}…`;await new Promise(r=>setTimeout(r,0));
 }
 const reference=await(await fetch('./references/ciede2000testdata.txt')).text();for(const line of reference.trim().split(/\r?\n/)){const a=line.trim().split(/\s+/).map(Number),e=deltaE2000(new Color('lab',a.slice(0,3)),new Color('lab',a.slice(3,6)));if(Math.abs(e-a[6])>.00005)receipt.failures.push('ciede-reference');else receipt.ciedeReference++;}
 // Kernel timing uses pretransformed coordinates: 512 unique sources × 64 targets,
 // seven iterations. It excludes decode, pixel scan and color-space conversion.
 const p=d.palettes[0];for(const mode of ['oklab','rgb','ok2','ciede2000','cam16ucs','hue4','helmlab']){const input=Array.from({length:512},(_,i)=>point((i*32771+19)&0xffffff,mode)),target=p.colors.map(c=>point(parseInt(c.slice(1),16),mode)),times=[];let checksum=0;for(let run=0;run<7;run++){const t=performance.now();for(const x of input){let best=Infinity,n=0;for(let i=0;i<target.length;i++){const e=score(x,target[i],mode);if(e<best){best=e;n=i;}}checksum+=n;}times.push(performance.now()-t);}times.sort((a,b)=>a-b);receipt.kernels.push({mode,medianMs:times[3],sources:512,palette:target.length,checksum});}
 const input=Array.from({length:512},(_,i)=>prepareCiede(inSpace((i*32771+19)&0xffffff,'lab').coords)),targets=p.colors.map(c=>prepareCiede(inSpace(parseInt(c.slice(1),16),'lab').coords)),times=[];let checksum=0;
 for(let run=0;run<7;run++){const t=performance.now();for(const x of input){let best=Infinity,n=0;for(let i=0;i<targets.length;i++){const e=ciedeSquared(x,targets[i]);if(e<best){best=e;n=i;}}checksum+=n;}times.push(performance.now()-t);}times.sort((a,b)=>a-b);receipt.kernels.push({mode:'ciede-direct',medianMs:times[3],sources:512,palette:targets.length,checksum});
 receipt.fastWinnerParity=checksum===receipt.kernels.find(x=>x.mode==='ciede2000').checksum;if(!receipt.fastWinnerParity)receipt.failures.push('direct-ciede-winners');
 receipt.transforms=[];for(const mode of ['oklab','ok2','cam16ucs','ciede2000']){const timings=[];for(let run=0;run<5;run++){clearCaches();const t=performance.now();for(let i=0;i<4096;i++)point((i*4099+33)&0xffffff,mode);timings.push(performance.now()-t);}timings.sort((a,b)=>a-b);receipt.transforms.push({mode,colors:4096,medianMs:timings[2]});}
 await fetch('/receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(receipt,null,2)});status.textContent=`Browser verification ${receipt.failures.length?'FAILED':'PASSED'} · baseline ${receipt.baselineParity} · candidate hashes ${receipt.candidateHashes} · alpha ${receipt.alpha} · decodes ${receipt.decode} · CIEDE reference ${receipt.ciedeReference}\nBrowser receipt saved`;
 }catch(e){status.textContent='Verification error: '+e.message;}finally{document.querySelector('#verify').disabled=false;}
};
</script></html>
