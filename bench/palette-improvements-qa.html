<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorfetti palette improvement acceptance</title>
<style>body{margin:0;font:14px system-ui;background:#eee;color:#151515}header,pre{padding:10px}button{padding:10px;font:inherit}iframe{width:100%;height:76vh;border:0;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<header><button id="run">Run palette improvement checks</button> <label><input id="online" type="checkbox">Also try public Lospec import</label> <span id="status">Ready</span></header><iframe id="app" title="Production Colorfetti"></iframe><pre id="out"></pre>
<script type="module">
const frame=document.querySelector('#app'),run=document.querySelector('#run'),status=document.querySelector('#status'),out=document.querySelector('#out');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));let w,d,report,artifacts,painted,observer;
const assert=(value,message)=>{if(!value)throw Error(message);};
const all=(selector,root=d)=>[...root.querySelectorAll(selector)];
const label=(text,root=d)=>root.querySelector('[aria-label="'+CSS.escape(text)+'"]');
const textButton=(text,root=d)=>all('button',root).find(n=>n.textContent.trim()===text);
const click=node=>{assert(node,'Missing control');assert(!node.disabled,'Disabled control '+(node.getAttribute('aria-label')||node.textContent));node.click();};
function input(node,value,event='input'){assert(node,'Missing input');node.value=value;node.dispatchEvent(new w.Event(event,{bubbles:true}));}
async function until(test,message,timeout=30000){const start=performance.now();while(!test()){assert(performance.now()-start<timeout,message);await pause(30);}return test();}
async function post(url,data){const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),body=await response.json();if(!response.ok)throw Error(body.error);return body;}
async function publish(){window.paletteImprovementsReport=report;out.textContent=JSON.stringify(report,null,2);await post('/report',report);}
async function check(name,action){status.textContent=name;const start=performance.now(),value=await action();report.checks.push({...value,name,pass:true,elapsedMs:Math.round(performance.now()-start)});await publish();}
const stored=()=>JSON.parse(w.localStorage.getItem('colorfetti'));
function fits(){const width=d.documentElement.clientWidth;assert(d.documentElement.scrollWidth<=width+1,'Horizontal document overflow');for(const n of all('.palette-setting-row,.palette-settings-panel,.palette-editor')){if(!n.getClientRects().length)continue;const r=n.getBoundingClientRect();assert(r.left>=-1&&r.right<=width+1,'Horizontal control overflow '+n.className);}return{width};}
async function settings(){if(!d.querySelector('.palette-settings-panel')){click(label('Palette settings'));await until(()=>d.querySelector('.palette-settings-panel'),'Recolor panel missing');}}
async function palette(id,name){if(!d.querySelector('.palette-family-tabs'))click(label('Palette'));await until(()=>label(name),'Palette missing '+name);click(label(name));await until(()=>stored().paletteId===id,'Palette selection not committed');}
async function configure(s){await settings();click(label(s.metric==='rgb'?'RGB matching':'Oklab matching'));click(label(s.cleanup?'Cleanup on':'Cleanup off'));if(s.maxColors){const box=label('Max colors value');input(box,s.maxColors);input(box,s.maxColors,'change');}else click(label('Use all palette colors'));click(label(s.dither==='none'?'Dithering off':'Dithering '+s.dither));if(s.dither!=='none'){await until(()=>label('Dither strength'),'Dither amount missing');input(label('Dither strength'),s.ditherStrength);input(label('Dither strength'),s.ditherStrength,'change');}if(s.alphaMode==='cut'||s.alphaCut!==undefined&&stored().alphaCut!==s.alphaCut){click(textButton('Cut',d.querySelector('.palette-settings-panel')));await until(()=>label('Palette opacity cut'),'Cut range missing');if(s.alphaCut!==undefined){const cut=label('Palette opacity cut');input(cut,s.alphaCut);input(cut,s.alphaCut,'change');}}if(s.alphaMode==='keep')click(textButton('Keep',d.querySelector('.palette-settings-panel')));await until(()=>{const value=stored();return Object.entries(s).every(([key,v])=>key==='paletteId'||value[key]===v);},'Settings did not commit '+JSON.stringify(s));}
const tile=name=>all('.tiles > .tile').find(n=>n.textContent.includes(name+'.'));
function b64(bytes){let result='';for(let i=0;i<bytes.length;i+=4096)result+=String.fromCharCode(...bytes.subarray(i,i+4096));return btoa(result);}
async function verifyArtifact(artifact,s){return post('/verify',{name:artifact.name,type:artifact.blob.type,base64:b64(new Uint8Array(await artifact.blob.arrayBuffer())),settings:s});}
async function artifactAfter(at,test,message){return until(()=>artifacts.slice(at).find(a=>a.name&&test(a)),message);}
async function zip(s,mutate){const at=artifacts.length,start=performance.now();click(label('Save all images'));if(mutate)await mutate();const artifact=await artifactAfter(at,a=>a.blob.type==='application/zip','Native ZIP missing');const ready=performance.now()-start;return{artifactReadyMs:ready,exports:await verifyArtifact(artifact,s)};}
async function paints(s,viewer=false){const figures=viewer?all('.image-viewer[open] .tile'):all('.tiles > .tile');assert(figures.length,'No paint surfaces');const start=performance.now();for(;;){try{let samples=0;for(const figure of figures){const name=['ramp','sprite','clip'].find(n=>figure.textContent.includes(n+'.'))??(viewer?'ramp':null),paint=painted.get(figure.querySelector('canvas'));assert(name&&paint,'Converted paint not published');await post('/paint',{name,width:paint.width,height:paint.height,rgba:[...paint.data],settings:s});samples+=paint.width*paint.height;}return{surfaces:figures.length,verifiedSamplePixels:samples,indicesAndUsedBytes:samples*2+figures.length*256,totalPreviewPayloadBytes:samples*(s.alphaMode==='keep'?3:2)+figures.length*256,alphaBytes:s.alphaMode==='keep'?samples:0,canvasRgbaBytes:samples*4,memoryScope:'sample indices/alpha/used and canvas RGBA only; excludes source, preparation, GPU and export scratch',...fits()};}catch(error){if(performance.now()-start>30000)throw error;await pause(50);}}}
async function add(){const transfer=new w.DataTransfer();for(const name of ['ramp.png','sprite.png','clip.gif']){const response=await fetch('/fixtures/'+name);transfer.items.add(new w.File([await response.arrayBuffer()],name,{type:response.headers.get('content-type')}));}const node=d.querySelector('input[type=file][multiple]');node.files=transfer.files;node.dispatchEvent(new w.Event('change',{bubbles:true}));await until(()=>all('.tiles > .tile').length===3,'Import did not publish all3 assets');}
async function sheet(name){click(label('Image actions for '+name+(name==='clip'?'.gif':'.png'),tile(name)));return until(()=>d.querySelector('.sheet[open]'),'Image actions not open');}
async function countClip(expected){const panel=await sheet('clip');click(textButton('Count output colors',panel));const button=await until(()=>all('button',panel).find(n=>/^Use \d+ output colors?$/.test(n.textContent.trim())),'Whole-animation color count missing');const match=button.textContent.match(/Use (\d+)/);assert(+match[1]===expected.usedColors,'Count differs from decoded GIF union');assert(tile('clip').textContent.includes(expected.usedColors+' colors used'),'Count caption missing');return{panel,button,count:+match[1]};}
async function closeSheet(){const panel=d.querySelector('.sheet[open]');if(panel){click(textButton('Cancel',panel));await until(()=>!d.querySelector('.sheet[open]'),'Sheet did not close');}}
function intercept(){
 const put=w.CanvasRenderingContext2D.prototype.putImageData;w.CanvasRenderingContext2D.prototype.putImageData=function(im,...args){if(this.canvas.closest('.tile'))painted.set(this.canvas,{width:im.width,height:im.height,data:im.data.slice()});return put.call(this,im,...args);};
 const create=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=blob=>{const href=create(blob);artifacts.push({blob,href});return href;};
 const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download&&this.href.startsWith('blob:')){const a=artifacts.find(a=>a.href===this.href);if(a)a.name=this.download;return;}return original.call(this);};
 const write=async items=>{for(const item of items){const blob=await item.getType('image/png');artifacts.push({blob,name:'ramp-palette.png',copy:true});}};
 if(w.navigator.clipboard)Object.defineProperty(w.navigator.clipboard,'write',{configurable:true,value:write});else Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{write}});
 w.addEventListener('error',e=>{if(!e.message.startsWith('ResizeObserver loop'))report.errors.push(e.message);});w.addEventListener('unhandledrejection',e=>report.errors.push(String(e.reason)));
}
run.onclick=async()=>{if(run.disabled)return;run.disabled=true;report={kind:'palette-improvements',paletteName:'QA clip output colors '+Date.now().toString(36),userAgent:navigator.userAgent,checks:[],errors:[],longTasks:[],longTaskObserverSupported:false,longTaskObservationScope:'Initial application load through persistence reload; kernel phase has a separate observer',started:new Date().toISOString()};artifacts=[];painted=new WeakMap();let keepExports,clipExpected;const base={paletteId:'preset-pico8',metric:'oklab',maxColors:8,cleanup:true,dither:'4x4',ditherStrength:50,alphaCut:128,alphaMode:'keep'};try{
 await new Promise(resolve=>{frame.onload=resolve;frame.src='/app/';});w=frame.contentWindow;d=w.document;await until(()=>label('Palette settings'),'Built app did not start');if(d.querySelector('.help[open]'))click(label('Close',d.querySelector('.help[open]')));intercept();
 try{observer=new w.PerformanceObserver(list=>{for(const entry of list.getEntries())report.longTasks.push({ms:entry.duration,phase:status.textContent});});observer.observe({type:'longtask',buffered:false});report.longTaskObserverSupported=true;}catch{}
 await check('Fresh defaults and two exact new presets',async()=>{assert(stored().alphaMode!=='keep','Fresh opacity is not Cut');await palette('preset-mono','Black & white');await palette('preset-edg8','ENDESGA 8');await palette('preset-pico8','PICO-8');return fits();});
 await check('Import partial-alpha ramp, sprite and three-frame clip',async()=>{await add();return{assets:3};});
 await check('Keep + dither + cap8 + Cleanup exact preview alpha',async()=>{await configure(base);return paints(base);});
 await check('Keep native PNG/GIF/ZIP independently decode',async()=>{const result=await zip(base);keepExports=result.exports;const ramp=keepExports.find(v=>v.name==='ramp-palette.png');assert(ramp.alphaValues.includes(127)&&ramp.alphaValues.includes(128),'Keep PNG lost partial alpha');clipExpected=keepExports.find(v=>v.name==='clip-palette.gif');assert(clipExpected.frames===3,'Clip not fully exported');assert(keepExports.length===3,'ZIP asset count');return result;});
 await check('Copy preserves native PNG alpha',async()=>{const at=artifacts.length,panel=await sheet('ramp');click(textButton('Copy',panel));const artifact=await artifactAfter(at,a=>a.copy,'Copy PNG missing');return{export:await verifyArtifact(artifact,base)};});
 await check('Captured Keep export survives immediate Cut edit',async()=>{await configure(base);const result=await zip(base,()=>configure({...base,alphaMode:'cut'}));return result;});
 await check('Cut native ZIP and preview remain exact',async()=>{const cut={...base,alphaMode:'cut'};await configure(cut);return{...await paints(cut),...await zip(cut)};});
 await check('Removed opacity slider cannot change remembered cutoff',async()=>{await configure({...base,alphaMode:'cut',alphaCut:191});const old=label('Palette opacity cut');click(textButton('Keep',d.querySelector('.palette-settings-panel')));await until(()=>!label('Palette opacity cut'),'Keep did not remove Cut range');input(old,17);input(old,17,'change');click(textButton('Cut',d.querySelector('.palette-settings-panel')));await until(()=>label('Palette opacity cut'),'Cut range did not return');assert(stored().alphaCut===191&&label('Palette opacity cut').value==='191','Stale range changed remembered cutoff');await configure(base);return{rememberedCut:191};});
 await check('Whole-GIF used count matches decoded export union',async()=>{const counted=await countClip(clipExpected);await closeSheet();return{used:counted.count,decodedUnion:clipExpected.colors,frames:3};});
 await check('Settings and family changes retire old count captions',async()=>{await configure({...base,metric:'rgb'});await until(()=>!tile('clip').textContent.includes('colors used'),'Changed matching retained stale caption');await configure(base);await countClip(clipExpected);await closeSheet();click(label('Palette'));await until(()=>d.querySelector('.palette-family-tabs'),'Family panel missing');click(textButton('1-bit',d.querySelector('.palette-family-tabs')));await until(()=>!tile('clip').textContent.includes('colors used'),'1-bit retained palette caption');click(textButton('Palette',d.querySelector('.palette-family-tabs')));await until(()=>label('Palette settings'),'Palette family return failed');assert(!tile('clip').textContent.includes('colors used'),'Family return restored invalid count');return fits();});
 await check('Use output colors opens exact whole-clip palette and HEX backup',async()=>{const counted=await countClip(clipExpected);click(counted.button);const editor=await until(()=>d.querySelector('.palette-import-modal[open]'),'Output palette editor missing');const swatches=all('.palette-review-swatch',editor).map(n=>n.getAttribute('aria-label').match(/#[a-f0-9]{6}/)[0]).sort();assert(JSON.stringify(swatches)===JSON.stringify(clipExpected.colors),'Draft colors differ from GIF union');assert(editor.textContent.includes('across all frames'),'Whole-animation source label absent');const at=artifacts.length;click(label('HEX backup',editor));const artifact=await artifactAfter(at,a=>a.name.endsWith('.hex'),'HEX backup missing');const backup=(await artifact.blob.text()).trim().split(/\s+/).sort();assert(JSON.stringify(backup)===JSON.stringify(clipExpected.colors),'HEX backup RGB mismatch');input(label('Name',editor),report.paletteName);click(textButton('Save palette',editor));await until(()=>!d.querySelector('.palette-import-modal[open]'),'Output palette Save failed');const library=JSON.parse(w.localStorage.getItem('colorfetti-palettes-v1')),saved=library.palettes.find(p=>p.name===report.paletteName);assert(saved&&JSON.stringify([...saved.colors].sort())===JSON.stringify(clipExpected.colors),'Saved library output RGB mismatch');report.savedPaletteId=saved.id;return{colors:backup,savedPaletteId:saved.id};});
 await check('Saved used palette and opacity policy restore after reload',async()=>{await new Promise(resolve=>{frame.onload=resolve;frame.src='/app/?keep=1';});w=frame.contentWindow;d=w.document;await until(()=>label('Palette settings'),'Reload failed');assert(stored().paletteId===report.savedPaletteId,'Saved selection did not restore');assert(stored().alphaMode==='keep','Keep policy did not restore');click(label('Palette'));await until(()=>label(report.paletteName),'Saved library entry missing');return fits();});
 await check('Bounded Keep versus Cut source-kernel timing and alpha memory',async()=>{
  const {quantizeAsync}=await import('/engine/quantize.js'),colors=['#fdfdf8','#d32734','#da7d22','#e6da29','#28c641','#2d93dd','#7b53ad','#1b1c33'],cases=[];
  const longTasks=[];let kernelObserver,longTaskObserverSupported=false,ticking=true,previousRaf=performance.now(),maxRafGapMs=0;
  try{kernelObserver=new PerformanceObserver(list=>{for(const entry of list.getEntries())longTasks.push(entry.duration);});kernelObserver.observe({type:'longtask',buffered:false});longTaskObserverSupported=true;}catch{}
  const heartbeat=now=>{if(!ticking)return;maxRafGapMs=Math.max(maxRafGapMs,now-previousRaf);previousRaf=now;requestAnimationFrame(heartbeat);};requestAnimationFrame(heartbeat);
  try{
  for(const partial of [false,true]){
   const width=256,height=128,data=new Uint8ClampedArray(width*height*4);let seed=314159;
   for(let i=0;i<width*height;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;data.set([seed>>>24,seed>>>16&255,seed>>>8&255,partial?[0,1,64,127,128,192,254,255][i%8]:i%8?255:0],i*4);}
   const source={width,height,data};let binaryCut;
   for(const alphaMode of ['cut','keep']){const times=[],intervals=[];let result;
    for(let run=0;run<4;run++){let previous=performance.now();const start=previous;result=await quantizeAsync(source,colors,128,undefined,undefined,{alphaMode,dither:'4x4',ditherStrength:50,onProgress:()=>{const now=performance.now();if(run)intervals.push(now-previous);previous=now;}});if(run)times.push(performance.now()-start);}
    if(alphaMode==='cut'){assert(!result.alpha,'Cut allocated alpha');if(!partial)binaryCut=result.indices;}else{assert(result.alpha?.byteLength===width*height,'Keep alpha budget mismatch');for(let i=0;i<result.alpha.length;i++)assert(result.alpha[i]===data[i*4+3],'Kernel source alpha mismatch');if(!partial)assert(result.indices.every((v,i)=>v===binaryCut[i]),'BinaryKeep changed matching output');}
    cases.push({source:partial?'partial-alpha':'binary-alpha',alphaMode,pixels:width*height,visiblePixels:result.indices.reduce((n,v)=>n+(v!==256),0),warmRuns:3,medianMs:[...times].sort((a,b)=>a-b)[1],timesMs:times,maxProgressIntervalMs:Math.max(0,...intervals),indicesAndUsedBytes:result.indices.byteLength+result.used.byteLength,alphaBytes:result.alpha?.byteLength??0});
   }
  }
  }finally{await new Promise(resolve=>requestAnimationFrame(resolve));ticking=false;kernelObserver?.disconnect();}
  return{cases,longTasks,longTaskObserverSupported,maxRafGapMs,scope:'Kernel and scheduler only, not FPS. PartialKeep includes more visible RGBs thanCut; binary case isolates policy overhead. Source RGBA, canvas, cleanup, GPU and encoder buffers excluded; actual partial PNG also needs RGBA rows.'};
 });
 await check('Optional real public Lospec URL import',async()=>{if(!document.querySelector('#online').checked)return{optional:true,outcome:'not requested'};click(label('Import palette'));const editor=await until(()=>d.querySelector('.palette-import-modal[open]'),'Import editor missing');click(textButton('Paste colors',editor));input(label('Colors or Lospec link',editor),'https://lospec.com/palette-list/slso8');await until(()=>textButton('Import from Lospec',editor),'Lospec mode not recognized');click(textButton('Import from Lospec',editor));try{await until(()=>all('.palette-review-swatch',editor).length===8||editor.querySelector('.palette-editor-error'),'Public import timed out',35000);const error=editor.querySelector('.palette-editor-error');if(error)return{optional:true,outcome:'network unavailable',message:error.textContent};assert(editor.querySelector('.palette-source-credit a')?.href==='https://lospec.com/palette-list/slso8','Lospec source link missing');return{optional:true,outcome:'success',swatches:8,paletteName:label('Name',editor).value};}finally{click(label('Close palette editor',editor));}});
 await check('Reset returns opacity Cut and dithering Off',async()=>{await settings();click(label('Reset palette settings'));await until(()=>stored().alphaMode==='cut'&&stored().dither==='none','Reset policy failed');assert(stored().alphaCut===128,'Reset cut not128');return fits();});
 await check('Remove only the saved palette created by this QA run',async()=>{
  const id=report.savedPaletteId;assert(id,'Owned saved palette identity missing');
  const before=JSON.parse(w.localStorage.getItem('colorfetti-palettes-v1')),owned=before.palettes.find(p=>p.id===id);assert(owned&&owned.name===report.paletteName,'Owned saved palette changed before cleanup');
  const unrelated=JSON.stringify(before.palettes.filter(p=>p.id!==id));
  await palette(id,report.paletteName);click(label('Edit palette'));
  const editor=await until(()=>d.querySelector('.palette-import-modal[open]'),'Cleanup editor missing');assert(stored().paletteId===id&&label('Name',editor).value===report.paletteName,'Cleanup editor ownership mismatch');
  const more=all('.palette-editor-details summary',editor).find(n=>n.textContent.trim()==='More options');click(more);click(textButton('Delete saved palette',editor));click(await until(()=>textButton('Delete palette',editor),'Delete confirmation missing'));
  await until(()=>!d.querySelector('.palette-import-modal[open]'),'Owned palette cleanup did not close');
  const after=JSON.parse(w.localStorage.getItem('colorfetti-palettes-v1'));assert(!after.palettes.some(p=>p.id===id),'Owned palette was retained');assert(JSON.stringify(after.palettes)===unrelated,'Cleanup changed an unrelated palette');assert(stored().paletteId!==id,'Deleted palette remains selected');
  return{deletedPaletteId:id,unrelatedPalettesPreserved:after.palettes.length};
 });
 assert(!report.errors.length,'Runtime errors: '+JSON.stringify(report.errors));report.completed=true;status.textContent='PASS';
 }catch(error){report.completed=false;report.error={message:error.message,stack:error.stack};status.textContent='FAIL: '+error.message;}finally{observer?.disconnect();report.finished=new Date().toISOString();await publish();run.disabled=false;}
};
</script>
