<!doctype html><meta charset="utf-8"><base href="/bench/important-colors-spike/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Important-color research checks</title>
<style>body{font:16px system-ui;max-width:64rem;margin:1rem auto;padding:1rem;color:#eee;background:#20242a}button{font:inherit;padding:1rem;margin:.4rem 0}canvas{image-rendering:pixelated;max-width:100%;border:1px solid #888}pre{white-space:pre-wrap;overflow-wrap:anywhere}.pair{display:flex;gap:1rem;flex-wrap:wrap}label{display:block}select{font:inherit;padding:.5rem}</style>
<h1>Important-color research checks</h1>
<p>Research algorithms only. This does not change Colorfetti. Checks compare actual RGBA outputs with the frozen Node results, including alpha, palette membership, duration weighting, mapped regions and deterministic repeats.</p>
<label>Device <select id="device"><option value="codex">Codex Browser</option><option value="android">USB Android</option></select></label>
<button id="run">Run frozen comparisons</button><pre id="status">Ready.</pre><div id="images"></div>
<script type="module">
import { revive,render,hashFrames,measure } from './core.mjs';
const button=document.querySelector('#run'),status=document.querySelector('#status'),images=document.querySelector('#images');
const params=new URLSearchParams(location.search);if(params.get('device')==='android')document.querySelector('#device').value='android';
function draw(output,label){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=label;canvas.width=output.width;canvas.height=output.height;canvas.style.width=Math.min(320,output.width*6)+'px';canvas.getContext('2d').putImageData(new ImageData(output.data,output.width,output.height),0,0);figure.append(caption,canvas);return figure;}
button.onclick=async()=>{button.disabled=true;images.replaceChildren();const started=performance.now();const report={at:new Date().toISOString(),device:document.querySelector('#device').value,userAgent:navigator.userAgent,scope:'Research modules only; not built app import/export.',checks:[],errors:[],timings:[]};
try{const fixture=await(await fetch('./device-input.json')).json();report.freeze=fixture.freeze;report.inputHashes=fixture.inputHashes;const items=Object.fromEntries(fixture.items.map(v=>[v.id,revive(v)]));for(const c of fixture.cases){status.textContent=`Running ${report.checks.length+1}/${fixture.cases.length}: ${c.id}`;const item=items[c.item],result=await render(item,c.colors,c.options),hash=await hashFrames(result.outputs),metrics=measure(item,result,c.options);if(hash!==c.hash)throw Error('Node RGBA mismatch '+c.id);if(metrics.alphaWrong||metrics.membershipWrong||metrics.usedCount>c.options.cap)throw Error('Invariant failure '+c.id);report.checks.push({id:c.id,hash,colors:result.colors,selectMs:result.selectMs,alphaWrong:metrics.alphaWrong,membershipWrong:metrics.membershipWrong,usedCount:metrics.usedCount,stableChurn:metrics.stableChurn});if(c.show){const pair=document.createElement('div');pair.className='pair';pair.append(draw(item.original,'Source'),draw(result.outputs[0],c.id));images.append(pair);}}
for(const c of fixture.invariants??[]){const item=items[c.item],base=await render(item,c.colors,c.options),split=await render(item,c.colors,{...c.options,chunkBytes:16,durationScale:7});const a=await hashFrames(base.outputs),b=await hashFrames(split.outputs);if(a!==b)throw Error('Chunk/duration scale invariant '+c.id);report.checks.push({id:c.id,hash:a,chunkDurationInvariant:true});}
for(const c of fixture.performance??[]){const item=items[c.item];for(const method of ['baseline','concave','hue'])await render(item,c.colors,{...c.options,method});for(let repeat=0;repeat<3;repeat++)for(const method of repeat%2?['hue','concave','baseline']:['baseline','concave','hue']){const result=await render(item,c.colors,{...c.options,method});report.timings.push({id:c.id,method,repeat,selectMs:result.selectMs});}}
report.passed=report.checks.length;report.elapsedMs=performance.now()-started;status.textContent=`Passed ${report.passed} checks.\n`+JSON.stringify(report,null,2);
}catch(error){report.errors.push(error.stack??String(error));status.textContent='FAILED\n'+report.errors.join('\n');}finally{report.elapsedMs=performance.now()-started;await fetch('/report?device='+report.device,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});button.disabled=false;}}
</script>
