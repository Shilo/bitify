<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto refinement research checks</title>
<style>body{font:15px system-ui;margin:16px;background:#fffdf9;color:#241d2d}button{min-height:44px;font:inherit;padding:8px 14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{display:inline-block;padding:12px 0}img{image-rendering:pixelated;max-width:100%}</style>
<h1>Auto refinement research</h1><p>Research candidates only. The production Auto algorithm is unchanged.</p>
<button id="run">Run refinement checks</button> <span id="status">Ready</span>
<p><a href="/bench/auto-refinement-comparison/index.html">Current / candidate / PixelLab outputs</a></p>
<pre id="report"></pre>
<script type="module">
import {refineAutoSubset} from '/bench/auto-refinement-spike/candidate.mjs';
import {colorize} from '/src/lib/quantize.js';
import {fullPaletteImage} from '/src/lib/palette-state.js';
import {selectPaletteSubset} from '/src/lib/palette-limit.js';
const output=document.querySelector('#report'),status=document.querySelector('#status'),button=document.querySelector('#run');
const assert=(test,message)=>{if(!test)throw Error(message);},median=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length/2)];
function hydrate(item){const image=im=>({...im,data:Uint8ClampedArray.from(im.data)});return{...item,original:image(item.original),...(item.frames?{frames:item.frames.map(f=>({...f,original:image(f.original)}))}:{})};}
const frames=item=>item.frames??[{original:item.original,delay:1}];
const lin=v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;};
function vector(rgb,metric){if(metric==='rgb')return rgb;const[r,g,b]=rgb.map(lin),l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s];}
const distance=(a,b)=>a.reduce((sum,v,i)=>sum+(v-b[i])**2,0);
async function render(item,colors,config){const converted=await fullPaletteImage(item,{colors,name:'Research',metric:config.metric,alphaMode:config.alphaMode,alphaCut:config.alphaCut,maxColors:0,dither:config.dither??'none',ditherStrength:50,cleanup:!!config.cleanup});const images=[];if(converted.getFrame){assert(converted.frameCount===item.frames.length,'Frame count changed');assert(converted.loop===item.loop,'Loop changed');for(let i=0;i<converted.frameCount;i++){const frame=await converted.getFrame(i);assert(frame.delay===item.frames[i].delay,'Frame delay changed');images.push({...colorize(frame,converted.colors),delay:frame.delay});}}else images.push(colorize(converted,converted.colors));images.colors=converted.colors;return images;}
function score(item,images,config){assert(images.length===frames(item).length,'Missing output frames');let cost=0,mass=0;const errorByRgb=new Map(),cut=config.alphaMode==='keep'?1:config.alphaCut;for(let f=0;f<images.length;f++){const src=frames(item)[f],dst=images[f];assert((dst.w??dst.width)===src.original.width&&(dst.h??dst.height)===src.original.height,'Dimensions changed');for(let p=0;p<src.original.data.length;p+=4){const alpha=src.original.data[p+3],expected=alpha>=cut?(config.alphaMode==='keep'?alpha:255):0;assert(dst.data[p+3]===expected,'Alpha mismatch');if(!expected)continue;const target='#'+[...dst.data.subarray(p,p+3)].map(n=>n.toString(16).padStart(2,'0')).join('');assert(images.colors.includes(target),'Output outside supplied target');const rgb=[...src.original.data.subarray(p,p+3)],error=distance(vector(rgb,config.metric),vector([...dst.data.subarray(p,p+3)],config.metric));cost+=error*src.delay;mass+=src.delay;const key=rgb.join(',');errorByRgb.set(key,Math.max(errorByRgb.get(key)??0,error));}}return{error:mass?cost/mass:0,errorByRgb};}
function exactLoss(item,base,changed){let lost=0;for(let f=0;f<base.length;f++)for(let p=0;p<base[f].data.length;p+=4){const src=frames(item)[f].original.data;if(base[f].data[p+3]&&[0,1,2].every(c=>base[f].data[p+c]===src[p+c])&&[0,1,2].some(c=>changed[f].data[p+c]!==src[p+c]))lost++;}return lost;}
const digest=async bytes=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');
async function pixelsHash(images){const bytes=new Uint8Array(images.reduce((sum,im)=>sum+im.data.length,0));let at=0;for(const im of images){bytes.set(im.data,at);at+=im.data.length;}return digest(bytes);}
button.onclick=async()=>{button.disabled=true;const report={device:/Android/.test(navigator.userAgent)?'android':'codex',userAgent:navigator.userAgent,started:new Date().toISOString(),checks:[],errors:[],productionChanged:false,longTasks:[],scope:'Research source kernels and production conversion modules, not Auto UI/worker/cache or encoded downloads. PASS means completed invariants, not shipping approval. Independent floating-point oracle tolerance1e-12; candidate strict guard itself has no epsilon.'};let observer;try{
  try{observer=new PerformanceObserver(list=>report.longTasks.push(...list.getEntries().map(e=>({start:e.startTime,duration:e.duration}))));observer.observe({type:'longtask',buffered:false});report.longTaskObserverSupported=true;}catch{report.longTaskObserverSupported=false;}
  report.sourceSha256={};for(const file of ['bench/auto-refinement-spike/candidate.mjs','src/lib/quantize.js','src/lib/palette-state.js','src/lib/palette-limit.js','src/lib/palette-dither.js','src/lib/palette-cleanup.js','src/lib/palette-alpha.js']){const response=await fetch('/'+file);assert(response.ok,'Missing source '+file);report.sourceSha256[file]=await digest(await response.arrayBuffer());}
  const response=await fetch('/bench/auto-refinement-spike/fixtures.json');assert(response.ok,'Fixtures missing');const bytes=await response.arrayBuffer(),fixture=JSON.parse(new TextDecoder().decode(bytes));report.fixturesSha256=await digest(bytes);const items=new Map(fixture.items.map(item=>[item.name,hydrate(item)]));
  for(const config of fixture.cases){status.textContent=config.id;const item=items.get(config.itemName);assert(item,'Missing fixture item');const base=await render(item,config.baselineColors,config),baseScore=score(item,base,config);for(const method of ['centroid','subset-swaps']){
    const before=performance.now(),candidate=await refineAutoSubset(config.baselineColors,item,{...config,method,guard:'strict',maxPasses:method==='subset-swaps'?4:6}),elapsedMs=performance.now()-before;
    assert(candidate.colors.length<=config.k,'Budget exceeded');assert(new Set(candidate.colors).size===candidate.colors.length,'Duplicate candidate colors');assert(candidate.variants.strict.stats.worsenedRgb===0&&candidate.variants.strict.stats.exactBaselineColorsLost===0,'Candidate own strict zero-epsilon guard failed');if(method==='subset-swaps')assert(candidate.colors.every(c=>config.sharedColors.includes(c)),'Target-preserving candidate escaped shared target');
    const images=await render(item,candidate.colors,config),actual=score(item,images,config);let worsenedSourceColors=0;for(const[rgb,error]of actual.errorByRgb)if(error>(baseScore.errorByRgb.get(rgb)??0)+1e-12*Math.max(1,error))worsenedSourceColors++;assert(worsenedSourceColors===0,'Strict guard allowed worse source RGB');
    const lostExactPixels=exactLoss(item,base,images);assert(lostExactPixels===0,'Strict candidate lost exact source pixels');const repeat=await refineAutoSubset(config.baselineColors,item,{...config,method,guard:'strict',maxPasses:method==='subset-swaps'?4:6});assert(JSON.stringify(candidate.colors)===JSON.stringify(repeat.colors),'Candidate nondeterministic');
    const downstream=[];for(const mode of [{dither:'4x4',cleanup:false},{dither:'8x8',cleanup:false},{dither:'4x4',cleanup:true}]){const settings={...config,...mode},oldScore=score(item,await render(item,config.baselineColors,settings),settings),newScore=score(item,await render(item,candidate.colors,settings),settings);downstream.push({...mode,baselineError:oldScore.error,candidateError:newScore.error,worse:newScore.error>oldScore.error+1e-12*Math.max(1,oldScore.error)});}
    report.checks.push({id:config.id,method,changed:candidate.changed,baselineColors:config.baselineColors,candidateColors:candidate.colors,sharedMembership:candidate.colors.every(c=>config.sharedColors.includes(c)),baselineError:baseScore.error,candidateError:actual.error,worsenedSourceColors,lostExactPixels,elapsedMs,baselineRgbaSha256:await pixelsHash(base),candidateRgbaSha256:await pixelsHash(images),downstream});
  }output.textContent=JSON.stringify(report,null,2);await new Promise(resolve=>setTimeout(resolve,0));}
  const source={width:256,height:128,data:Uint8ClampedArray.from({length:256*128*4},(_,i)=>{const x=Math.floor(i/4)%256,y=Math.floor(i/1024);return i%4===3?255:[x%16*17,y%16*17,(Math.floor(x%64/16)+Math.floor(y%64/16)*4)*17][i%4];})},item={name:'large-4096-rgb-kernel',original:source},shared=fixture.cases.find(c=>c.sharedColors.length>=16)?.sharedColors;assert(shared,'Missing shared palette for cost check');
  const read=async function*(){for(let at=0;at<source.data.length;at+=131072)yield{data:source.data.subarray(at,at+131072),weight:1};},samples={baseline:[],withRefinement:[]};let selected;
  for(let run=0;run<4;run++)for(const mode of run%2?['withRefinement','baseline']:['baseline','withRefinement']){const start=performance.now();selected=await selectPaletteSubset(shared,8,read,{alphaCut:128,metric:'oklab'});if(mode==='withRefinement')await refineAutoSubset(selected.indices.map(i=>shared[i]),item,{metric:'oklab',alphaCut:128,alphaMode:'cut',guard:'strict',method:'subset-swaps',sharedColors:shared,maxPasses:4});if(run)samples[mode].push(performance.now()-start);}
  report.performance={scope:'Source-kernel subset selection versus same selection plus research refinement; excludes decode, workers and production UI. Alternating order, one warmup and three samples.',pixels:32768,samplesMs:samples,medianMs:{baseline:median(samples.baseline),withRefinement:median(samples.withRefinement)}};
  const controller=new AbortController();controller.abort();try{await refineAutoSubset(selected.indices.map(i=>shared[i]),item,{method:'subset-swaps',sharedColors:shared,signal:controller.signal});throw Error('Canceled candidate completed');}catch(error){assert(error.name==='AbortError','Cancellation did not return AbortError');}report.preCanceledCheck=true;
  const active=new AbortController(),abortStart=performance.now();const timer=setTimeout(()=>active.abort(),0);try{await refineAutoSubset(selected.indices.map(i=>shared[i]),item,{method:'subset-swaps',sharedColors:shared,signal:active.signal});throw Error('In-flight canceled candidate completed');}catch(error){assert(error.name==='AbortError','In-flight cancellation did not return AbortError');}finally{clearTimeout(timer);}report.inFlightAbortMs=performance.now()-abortStart;
  report.completed=true;status.textContent='PASS — research only';
}catch(error){report.completed=false;report.errors.push({message:error.message,stack:error.stack});status.textContent='FAIL: '+error.message;}finally{observer?.disconnect();report.finished=new Date().toISOString();output.textContent=JSON.stringify(report,null,2);await fetch('/report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(report)});button.disabled=false;}};
</script>
