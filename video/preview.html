<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorfetti trailer editor preview</title>
<style>
  body { margin: 0; background: #14151a; color: #fffdf9; font: 14px system-ui; }
  #stage { position: relative; aspect-ratio: 16/9; max-height: calc(100vh - 100px); margin: auto; overflow: hidden; }
  iframe { width: 1920px; height: 1080px; border: 0; transform-origin: top left; }
  footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px; }
  input { flex: 1; min-width: 120px; accent-color: #0eaaa5; }
  button { padding: 8px 18px; cursor: pointer; }
  output { min-width: 90px; font-variant-numeric: tabular-nums; }
  small { color: #b7bbc8; }
</style>
<div id="stage"><iframe title="Trailer composition" src=".work/film.html"></iframe></div>
<footer>
  <button type="button" id="play">Play</button>
  <input aria-label="Time in seconds" type="range" min="0" max="30" step="0.01" value="0">
  <output>0.00 / 30s</output>
  <small>Refresh after editing and rebuilding. Preview controls are excluded from exports.</small>
</footer>
<audio src=".work/audio/music.wav" preload="metadata"></audio>
<script>
  const frame = document.querySelector('iframe'), stage = document.querySelector('#stage');
  const slider = document.querySelector('input'), output = document.querySelector('output');
  const button = document.querySelector('button'), audio = document.querySelector('audio');
  let ready = false, playing = false;
  function fit() {
    const width = Math.min(innerWidth, (innerHeight - 100) * 16 / 9);
    stage.style.width = Math.max(1, width) + 'px';
    frame.style.transform = 'scale(' + Math.max(1, width) / 1920 + ')';
  }
  function draw(t) {
    if (ready) frame.contentWindow.renderFrame(t);
    slider.value = t;
    output.value = t.toFixed(2) + ' / 30s';
  }
  function pause() { playing = false; audio.pause(); button.textContent = 'Play'; }
  function tick() {
    if (!playing) return;
    draw(Math.min(30, audio.currentTime));
    if (audio.ended || audio.currentTime >= 30) pause();
    else requestAnimationFrame(tick);
  }
  frame.addEventListener('load', async () => { await frame.contentWindow.filmReady; ready = true; draw(Number(slider.value)); });
  button.onclick = async () => {
    if (playing) return pause();
    if (Number(slider.value) >= 30) draw(0);
    audio.currentTime = Number(slider.value);
    await audio.play(); playing = true; button.textContent = 'Pause'; tick();
  };
  slider.oninput = () => { pause(); audio.currentTime = Number(slider.value); draw(Number(slider.value)); };
  addEventListener('resize', fit); fit();
</script>
</html>
